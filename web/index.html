<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="description" content="ClaudeClaw Enterprise AI Agent Platform" />
    <!-- title + favicon are RUNTIME-OVERRIDABLE: the named-theme engine
         (web/src/lib/theme.ts, applied in main.tsx before mount via bootTheme())
         rewrites document.title and the <link rel="icon"> href to the active
         theme's name and favicon. These tags are the no-flash defaults (the
         stock product title + lobster favicon); keep them so a theme can swap
         them at runtime. Do not remove the rel="icon" link — setFavicon() finds
         and updates it by that selector. -->
    <title>ClaudeClaw Enterprise</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦞</text></svg>" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
