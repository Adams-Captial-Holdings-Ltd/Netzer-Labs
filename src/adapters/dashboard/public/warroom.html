<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>War Room - ClaudeClaw</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #050505; --bg-elev: #0b0b0f; --bg-elev-2: #13131a;
      --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.16);
      --text: #e5e5ec; --text-dim: #9ca3af; --text-mute: #6b7280;
      --indigo: #6366f1; --indigo-soft: rgba(99,102,241,0.22);
      --green: #22c55e; --amber: #f59e0b; --red: #ef4444;
      --user-bubble: #3730a3;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; height: 100vh; overflow: hidden; }
    .app { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 56px 1fr; height: 100vh; }

    /* Header */
    .header {
      grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent), var(--bg-elev);
      height: 56px;
    }
    .header .left { display: flex; align-items: center; gap: 16px; }
    .header .back { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; color: var(--text-dim); text-decoration: none; font-size: 16px; }
    .header .back:hover { background: rgba(255,255,255,0.06); color: var(--text); }
    .header .brand-title { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; }
    .header .brand-sub { font-size: 10px; color: var(--text-mute); letter-spacing: 1.2px; text-transform: uppercase; margin-top: 2px; }
    .header .right { display: flex; gap: 8px; }
    .btn { font-family: inherit; font-size: 12px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-elev-2); color: var(--text); cursor: pointer; transition: all 120ms ease; }
    .btn:hover { background: rgba(255,255,255,0.06); border-color: var(--border-strong); }
    .btn.danger { color: #fca5a5; border-color: rgba(239,68,68,0.3); }
    .btn.danger:hover { background: rgba(239,68,68,0.1); }
    .btn.primary { background: var(--indigo); border-color: var(--indigo); color: #fff; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Sidebar */
    .sidebar {
      grid-column: 1; grid-row: 2; border-right: 1px solid var(--border);
      background: var(--bg-elev); overflow-y: auto; padding: 12px 8px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .sidebar-header {
      padding: 6px 8px 10px; font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--text-mute); letter-spacing: 1.2px; text-transform: uppercase;
    }
    .room-card {
      display: flex; flex-direction: column; gap: 4px; padding: 12px;
      border-radius: 12px; border: 1px solid var(--border); background: var(--bg-elev);
      cursor: pointer; transition: all 120ms ease;
    }
    .room-card:hover { background: var(--bg-elev-2); border-color: var(--border-strong); }
    .room-card.active { border-color: var(--indigo); background: var(--indigo-soft); }
    .room-card .title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .room-card .title .dot { width: 7px; height: 7px; border-radius: 50%; }
    .room-card .title .dot.live { background: var(--green); }
    .room-card .title .dot.ended { background: var(--text-mute); }
    .room-card .meta { font-size: 11px; color: var(--text-mute); }
    .new-room-btn { margin: 8px 4px; padding: 10px; background: var(--indigo); color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 13px; text-align: center; }
    .new-room-btn:hover { opacity: 0.9; }

    /* Main pane */
    .main { grid-column: 2; grid-row: 2; display: grid; grid-template-rows: 1fr auto; min-height: 0; }
    .transcript {
      overflow-y: auto; overflow-x: hidden; min-height: 0;
      padding: 20px 24px 8px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;
    }
    .transcript-empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-mute); font-size: 13px; text-align: center; padding: 40px 20px; gap: 8px;
    }
    .transcript-empty .lg { font-size: 15px; color: var(--text-dim); font-weight: 500; }

    /* Bubbles */
    .bubble { display: flex; gap: 10px; align-items: flex-start; max-width: 100%; }
    .bubble.user { justify-content: flex-end; align-self: flex-end; }
    .bubble.user .content {
      background: var(--user-bubble); border-radius: 14px 14px 4px 14px; padding: 10px 14px;
      font-size: 14px; color: #eef2ff; white-space: pre-wrap; overflow-wrap: break-word;
      line-height: 1.45; max-width: 520px;
    }
    .bubble.user .ts { font-size: 10px; color: #a5b4fc; margin-top: 2px; text-align: right; opacity: 0.8; }
    .bubble.agent { flex-direction: row; max-width: 820px; align-self: flex-start; }
    .bubble.agent .avatar {
      width: 32px; height: 32px; border-radius: 50%; background: #1a1a25; border: 1px solid var(--border);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: var(--text-dim);
    }
    .bubble.agent .body { flex: 1; min-width: 0; }
    .bubble.agent .header-line { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
    .bubble.agent .name { font-size: 13px; font-weight: 600; }
    .bubble.agent .ts { font-size: 10px; color: var(--text-mute); }
    .bubble.agent .content {
      font-size: 14px; line-height: 1.55; color: var(--text); white-space: pre-wrap;
      overflow-wrap: break-word; background: var(--bg-elev-2); border-radius: 4px 14px 14px 14px;
      padding: 10px 14px; border-left: 3px solid var(--indigo);
    }
    .bubble.system { align-self: center; color: var(--text-mute); font-size: 12px; font-style: italic; padding: 4px 12px; }
    .typing-indicator { align-self: flex-start; padding: 8px 14px; color: var(--text-mute); font-size: 12px; font-style: italic; display: none; }
    .typing-indicator.visible { display: block; }

    /* Composer */
    .composer {
      padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px;
      background: var(--bg-elev);
    }
    .composer input {
      flex: 1; padding: 12px 16px; background: var(--bg-elev-2); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 14px; font-family: inherit; outline: none;
    }
    .composer input:focus { border-color: var(--indigo); }
    .composer button {
      padding: 12px 24px; background: var(--indigo); color: #fff; border: none; border-radius: 10px;
      font-weight: 600; cursor: pointer; font-size: 14px; font-family: inherit;
    }
    .composer button:hover { opacity: 0.9; }
    .composer button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 420px; max-width: 90vw; }
    .modal h3 { margin: 0 0 16px; font-size: 16px; }
    .modal label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; margin-top: 12px; }
    .modal input { width: 100%; padding: 10px 14px; background: var(--bg-elev-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; font-family: inherit; }
    .modal .actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }

    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module">
    const TOKEN = localStorage.getItem('cce_token') || prompt('Dashboard token:');
    if (TOKEN) localStorage.setItem('cce_token', TOKEN);
    const API = '/warroom';
    const H = () => ({ 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' });

    let rooms = [], activeRoom = null, turns = [], evtSource = null;
    const app = document.getElementById('app');

    async function fetchRooms() {
      const r = await fetch(`${API}?mine=dashboard`, { headers: H() });
      if (r.ok) { const d = await r.json(); rooms = d.meetings || []; }
    }
    async function fetchHistory(id) {
      const r = await fetch(`${API}/${id}/history`, { headers: H() });
      if (r.ok) { const d = await r.json(); turns = d.turns || []; }
    }
    async function createRoom(title) {
      const r = await fetch(API, { method: 'POST', headers: H(), body: JSON.stringify({ title, createdBy: 'dashboard', participants: [] }) });
      return r.ok ? r.json() : null;
    }
    async function postTurn(id, content) {
      await fetch(`${API}/${id}/turn`, { method: 'POST', headers: H(), body: JSON.stringify({ speaker: 'dashboard', content }) });
    }
    async function endRoom(id) {
      await fetch(`${API}/${id}/end`, { method: 'POST', headers: H() });
    }

    function connectSSE(meetingId) {
      if (evtSource) evtSource.close();
      evtSource = new EventSource(`${API}/${meetingId}/stream?sinceSeq=0&token=${encodeURIComponent(TOKEN)}`);
      evtSource.onmessage = (e) => {
        try {
          const evt = JSON.parse(e.data);
          if (evt.type === 'turn_start') {
            turns.push({ seq: Number(e.lastEventId), speaker: evt.speaker, content: evt.content, type: 'user', ts: evt.ts });
            renderTranscript();
          } else if (evt.type === 'agent_done') {
            turns.push({ seq: evt.seq, speaker: evt.agentId, content: evt.text, type: 'agent', ts: new Date().toISOString() });
            renderTranscript();
          } else if (evt.type === 'agent_typing') {
            const el = document.getElementById('typing');
            if (el) { el.textContent = `${evt.agentId} is thinking...`; el.classList.add('visible'); }
          } else if (evt.type === 'meeting_ended') {
            activeRoom.status = 'ended';
            render();
          } else if (evt.type === 'system_note') {
            turns.push({ seq: 0, speaker: 'system', content: evt.text, type: 'system', ts: new Date().toISOString() });
            renderTranscript();
          }
        } catch {}
      };
      evtSource.onerror = () => { setTimeout(() => connectSSE(meetingId), 3000); };
    }

    function fmtTime(ts) {
      if (!ts) return '';
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

    function render() {
      app.innerHTML = `
        <div class="header">
          <div class="left">
            <a href="/dashboard" class="back">&#8592;</a>
            <div>
              <div class="brand-title">${activeRoom ? esc(activeRoom.title) : 'War Room'}</div>
              <div class="brand-sub">${activeRoom ? (activeRoom.status === 'active' ? 'LIVE' : 'ENDED') : 'SELECT A ROOM'}</div>
            </div>
          </div>
          <div class="right">
            ${activeRoom?.status === 'active' ? '<button class="btn danger" id="end-btn">End Room</button>' : ''}
          </div>
        </div>
        <div class="sidebar">
          <div class="sidebar-header">Rooms</div>
          ${rooms.map(r => `
            <div class="room-card ${activeRoom?.meetingId === r.meetingId ? 'active' : ''}" data-id="${r.meetingId}">
              <div class="title"><span class="dot ${r.status === 'active' ? 'live' : 'ended'}"></span>${esc(r.title)}</div>
              <div class="meta">${r.participants?.length || 0} participants</div>
            </div>
          `).join('')}
          <button class="new-room-btn" id="new-btn">+ New War Room</button>
        </div>
        <div class="main">
          ${activeRoom ? `
            <div class="transcript" id="transcript">
              ${turns.length === 0 ? '<div class="transcript-empty"><div class="lg">No messages yet</div><div>Send a message to begin</div></div>' : ''}
              ${turns.map(t => renderBubble(t)).join('')}
              <div class="typing-indicator" id="typing"></div>
            </div>
            ${activeRoom.status === 'active' ? `
              <div class="composer">
                <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" />
                <button id="send-btn">Send</button>
              </div>
            ` : '<div class="composer" style="justify-content:center;color:var(--text-mute);font-size:12px;">Meeting ended</div>'}
          ` : '<div class="transcript"><div class="transcript-empty"><div class="lg">Select or create a War Room</div></div></div>'}
        </div>
      `;
      bindEvents();
      scrollToBottom();
    }

    function renderBubble(t) {
      if (t.type === 'system') return `<div class="bubble system">${esc(t.content)}</div>`;
      if (t.type === 'agent') return `
        <div class="bubble agent">
          <div class="avatar">${esc((t.speaker || '?')[0].toUpperCase())}</div>
          <div class="body">
            <div class="header-line"><span class="name">${esc(t.speaker)}</span><span class="ts">${fmtTime(t.ts)}</span></div>
            <div class="content">${esc(t.content)}</div>
          </div>
        </div>`;
      return `
        <div class="bubble user">
          <div>
            <div class="content">${esc(t.content)}</div>
            <div class="ts">${fmtTime(t.ts)}</div>
          </div>
        </div>`;
    }

    function renderTranscript() {
      const el = document.getElementById('transcript');
      if (!el) return;
      const wasAtBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
      el.innerHTML = turns.map(t => renderBubble(t)).join('') + '<div class="typing-indicator" id="typing"></div>';
      if (wasAtBottom) scrollToBottom();
    }

    function scrollToBottom() {
      const el = document.getElementById('transcript');
      if (el) el.scrollTop = el.scrollHeight;
    }

    function bindEvents() {
      document.querySelectorAll('.room-card').forEach(el => { el.onclick = () => selectRoom(el.dataset.id); });
      document.getElementById('new-btn')?.addEventListener('click', showCreateModal);
      document.getElementById('end-btn')?.addEventListener('click', async () => { if (activeRoom) { await endRoom(activeRoom.meetingId); await refresh(); } });
      document.getElementById('send-btn')?.addEventListener('click', sendMessage);
      document.getElementById('msg-input')?.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    }

    async function selectRoom(id) {
      activeRoom = rooms.find(r => r.meetingId === id) || null;
      if (activeRoom) { await fetchHistory(id); connectSSE(id); }
      render();
    }

    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input?.value?.trim();
      if (!text || !activeRoom) return;
      input.value = '';
      input.focus();
      await postTurn(activeRoom.meetingId, text);
      await fetchHistory(activeRoom.meetingId);
      render();
    }

    function showCreateModal() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal">
          <h3>New War Room</h3>
          <label>Title</label>
          <input id="modal-title" placeholder="Incident #42" autofocus />
          <div class="actions">
            <button class="btn" id="modal-cancel">Cancel</button>
            <button class="btn primary" id="modal-create">Create</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      document.getElementById('modal-cancel').onclick = () => overlay.remove();
      document.getElementById('modal-create').onclick = async () => {
        const title = document.getElementById('modal-title').value.trim() || 'War Room';
        const room = await createRoom(title);
        overlay.remove();
        if (room) { await fetchRooms(); activeRoom = room; turns = []; connectSSE(room.meetingId); render(); }
      };
      document.getElementById('modal-title').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('modal-create').click();
      });
    }

    async function refresh() { await fetchRooms(); if (activeRoom) { activeRoom = rooms.find(r => r.meetingId === activeRoom.meetingId) || null; if (activeRoom) await fetchHistory(activeRoom.meetingId); } render(); }

    await fetchRooms();
    render();
  </script>
</body>
</html>
