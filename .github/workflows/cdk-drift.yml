name: CDK drift check

# Catches the "production source has undeployed infra changes" failure mode (the complement
# to the in-app drift-watch worker, which catches manual changes to deployed
# resources). Runs `cdk diff` against the live account and FAILS if anything
# differs — so drift can't sit unnoticed.
#
# Requires (set once in the repo's GitHub settings):
#   - Secret  CDK_DIFF_ROLE_ARN  — an IAM role this workflow assumes via OIDC
#       (created by scripts: trusts token.actions.githubusercontent.com for this
#        repo; allowed to assume the cdk-hnb659fds-* bootstrap roles + read CFN).
#   - Variables (Settings > Variables): DOMAIN_NAME, BEDROCK_OPUS_MODEL,
#       BEDROCK_SONNET_MODEL, BEDROCK_HAIKU_MODEL, BEDROCK_DEFAULT_MODEL,
#       BEDROCK_EMBED_MODEL, CCE_COST_ALERT_EMAIL, CCE_MONTHLY_BUDGET_USD,
#       CCE_ANOMALY_MONITOR_ARN, CCE_EMAIL_FROM, CCE_DASHBOARD_URL,
#       CCE_SES_CONFIG_SET, JARVIS_GREETING, CCE_POWER_COST_NOTE,
#       CCE_POWER_URL  — the same values deploy.ts forwards, so synth
#       reproduces the deployed state (esp. DOMAIN_NAME for the HTTPS edge,
#       the email vars for the magic-link task-def env, and the power vars
#       for the power-switch Lambda env + the security-stack paused-mode
#       CloudFront reroute).
# Note: CCE_DAILY_COST_CAP_USD is intentionally NOT set (the cap comes from the
# tier default + runtime-config; see compute-stack).

# No pull_request trigger: CDK_DIFF_ROLE_ARN is unset, so the job can only fail
# with "Could not load credentials" and reds every PR, which teaches reviewers to
# ignore CI. It still runs daily and on demand. Restore the trigger once the
# secret and variables above exist:
#   pull_request:
#     paths: ['infra/**', 'package.json', 'package-lock.json']
on:
  schedule:
    - cron: '0 13 * * *' # daily 13:00 UTC
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.CDK_DIFF_ROLE_ARN }}
          aws-region: us-east-1
      # This is an INFRA-drift check, not an app-version check. The task def
      # pins two per-deploy stamps that legitimately differ from the local
      # checkout — the image tag and DEPLOY_SHA — so we resolve BOTH read-only
      # from the live service and feed them to synth. Otherwise the diff flags
      # them on every commit that isn't redeployed (the historical red). Needs
      # ecs:DescribeTaskDefinition on the role; if it can't read ECS, both fall
      # back to the local git sha (and the check may red until a redeploy).
      - name: Resolve deployed image tag + DEPLOY_SHA
        id: live
        run: |
          IMAGE=$(aws ecs describe-task-definition \
            --task-definition claudeclaw-orchestrator \
            --region us-east-1 \
            --query 'taskDefinition.containerDefinitions[?name==`orchestrator`]|[0].image' \
            --output text 2>/dev/null || true)
          TAG="${IMAGE##*:}"
          if [ "$TAG" = "$IMAGE" ] || [ -z "$TAG" ]; then TAG=""; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "deployed image tag: ${TAG:-<unresolved>}"
          SHA=$(aws ecs describe-task-definition \
            --task-definition claudeclaw-orchestrator \
            --region us-east-1 \
            --query 'taskDefinition.containerDefinitions[?name==`orchestrator`]|[0].environment[?name==`DEPLOY_SHA`]|[0].value' \
            --output text 2>/dev/null || true)
          if [ -n "$SHA" ] && [ "$SHA" != "None" ]; then
            echo "DEPLOY_SHA=$SHA" >> "$GITHUB_ENV"
            echo "deployed DEPLOY_SHA: $SHA"
          else
            echo "deployed DEPLOY_SHA: <unresolved, synth uses local gitSha()>"
          fi
          # Paperclip work engine (ADR 0010). paperclip-stack.ts pins BOTH its
          # task definitions to this digest, so a synth without it renders an
          # unpullable placeholder and the diff can NEVER match a deployed
          # stack -- permanently red, which this file's own header warns
          # teaches reviewers to ignore CI. Resolved read-only from the live
          # task definition, exactly like the two stamps above. Empty until
          # prod actually runs the engine, which is harmless while the three
          # substrate stacks are excluded from the diff below.
          PCIMAGE=$(aws ecs describe-task-definition --task-definition claudeclaw-paperclip --region us-east-1 --query 'taskDefinition.containerDefinitions[0].image' --output text 2>/dev/null || true)
          case "$PCIMAGE" in
            *@sha256:*) DIGEST="${PCIMAGE##*@}" ;;
            *) DIGEST="" ;;
          esac
          echo "paperclip_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "deployed Paperclip digest: ${DIGEST:-<unresolved>}"
      # Synthesize ONCE into an explicit assembly, so the diff below can be
      # handed a cloud assembly instead of re-running the app — and so this step
      # can remove the two Outputs described under it before anything is
      # compared.
      - name: Synthesize the drift assembly
        env:
          CCE_IMAGE_TAG: ${{ steps.live.outputs.tag }}
          CDK_STACK_NAME: CCE
          DEPLOY_TIER: '3'
          CCE_TIER: '3'
          CCE_IAM_COPILOT_WRITE: '1'
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          BEDROCK_OPUS_MODEL: ${{ vars.BEDROCK_OPUS_MODEL }}
          BEDROCK_SONNET_MODEL: ${{ vars.BEDROCK_SONNET_MODEL }}
          BEDROCK_HAIKU_MODEL: ${{ vars.BEDROCK_HAIKU_MODEL }}
          BEDROCK_DEFAULT_MODEL: ${{ vars.BEDROCK_DEFAULT_MODEL }}
          BEDROCK_EMBED_MODEL: ${{ vars.BEDROCK_EMBED_MODEL }}
          CCE_COST_ALERT_EMAIL: ${{ vars.CCE_COST_ALERT_EMAIL }}
          CCE_MONTHLY_BUDGET_USD: ${{ vars.CCE_MONTHLY_BUDGET_USD }}
          CCE_ANOMALY_MONITOR_ARN: ${{ vars.CCE_ANOMALY_MONITOR_ARN }}
          # Magic-link email config + Jarvis greeting (deploy.ts forwards these
          # same vars). Without them synth emits the code defaults and the diff
          # flags the deployed task-def env on every run.
          CCE_EMAIL_FROM: ${{ vars.CCE_EMAIL_FROM }}
          CCE_DASHBOARD_URL: ${{ vars.CCE_DASHBOARD_URL }}
          CCE_SES_CONFIG_SET: ${{ vars.CCE_SES_CONFIG_SET }}
          JARVIS_GREETING: ${{ vars.JARVIS_GREETING }}
          # Power-switch panel cost line (power-switch-stack env COST_NOTE).
          # Forwarded like the email vars so synth matches the deployed Lambda.
          CCE_POWER_COST_NOTE: ${{ vars.CCE_POWER_COST_NOTE }}
          # Power panel URL: drives the security-stack paused-mode CloudFront
          # reroute (and the app proxy fallback). Synth must match deployed.
          CCE_POWER_URL: ${{ vars.CCE_POWER_URL }}
          CCE_PAPERCLIP_IMAGE_DIGEST: ${{ steps.live.outputs.paperclip_digest }}
        # DATED SUPPRESSION (added 2026-08-23), the other half of the stack
        # exclusion below. Excluding CCE-Database/CCE-Filesystem/CCE-Paperclip
        # was not enough: their mere PRESENCE in the assembly makes CDK emit a
        # CloudFormation EXPORT in each stack they consume a value from, and two
        # of those producers are stacks this job DOES diff. Production has not
        # deployed the substrate, so its deployed templates carry neither export
        # and the job reds every day on two Outputs -- the exact failure the
        # header of this file warns about, one layer below where the last round
        # looked.
        #
        #   CCE-Network  ExportsOutputFnGetAttPaperclipSg*   the Paperclip task
        #                SG's GroupId, consumed by all three substrate stacks
        #   CCE-Compute  ExportsOutputRefCluster*            the shared ECS
        #                cluster, consumed by CCE-Paperclip
        #
        # Both stacks stay FULLY DIFFED -- only these two named Outputs are
        # dropped from the synthesized side, so real drift in the VPC, the NAT
        # layout, the ALB, the task definition, the IAM statements and the
        # security-group rules still fails this job. That is the difference
        # between this and excluding the two stacks, which would have bought the
        # same green by gutting the check.
        #
        # RESTORE THIS AND THE STACK EXCLUSION BELOW TOGETHER, as soon as a
        # production deploy has actually created the substrate: from that moment
        # the exports exist in the deployed templates too, and stripping them
        # from synth turns the same two lines into a spurious `[-] Output`. That
        # is deliberate -- it reds loudly rather than hiding, so the restore
        # cannot be forgotten quietly. The "exactly one match" assertion does the
        # same job in the other direction: if a rename makes these patterns match
        # nothing, this step FAILS instead of silently suppressing nothing.
        # If neither has happened by 2026-10-01, escalate rather than extend.
        run: |
          npx cdk synth --quiet --output cdk.out.drift
          node -e '
            const fs = require("fs");
            const targets = [
              ["cdk.out.drift/CCE-Network.template.json", /^ExportsOutputFnGetAttPaperclipSg/],
              ["cdk.out.drift/CCE-Compute.template.json", /^ExportsOutputRefCluster/],
            ];
            for (const [file, re] of targets) {
              const t = JSON.parse(fs.readFileSync(file, "utf8"));
              const hit = Object.keys(t.Outputs || {}).filter((k) => re.test(k));
              if (hit.length !== 1) {
                console.error("::error::" + file + ": expected exactly one Output matching " + re + ", found " + hit.length + ". The Phase 9 export suppression in cdk-drift.yml is stale - read the comment above this step.");
                process.exit(1);
              }
              delete t.Outputs[hit[0]];
              fs.writeFileSync(file, JSON.stringify(t, null, 1));
              console.log("suppressed " + hit[0] + " from " + file);
            }
          '

      # DATED EXCLUSION (added 2026-08-23). The pattern was "CCE-*".
      # ADR 0010 Phase 9 puts CCE-Database, CCE-Filesystem and CCE-Paperclip
      # into the assembly at EVERY tier and POPULATES them at Tier 1+ -- and
      # this job synthesizes at CCE_TIER 3. Production has not deployed the
      # substrate yet, so from the day Phase 9 merges those three stacks
      # differ by their entire contents and this job reds EVERY DAY, which is
      # precisely the failure the header of this file says teaches reviewers
      # to ignore CI.
      #
      # RESTORE "CCE-*" as soon as a production deploy has actually created
      # the substrate: after that, an excluded stack is undetected drift on a
      # RETAIN'd, deletion-protected Aurora cluster. If that has not happened
      # by 2026-10-01, the exclusion is itself the problem and should be
      # escalated rather than extended.
      #
      # `--app` on the pre-synthesized assembly, NOT a second synth: the diff
      # has to see the templates the step above edited, and re-running the app
      # here would put the two exports straight back.
      - name: cdk diff (fail on drift)
        run: npx cdk diff --fail --app cdk.out.drift CCE-Network CCE-Storage CCE-Guardrails CCE-Secrets CCE-Dynamo CCE-Messaging CCE-Iam CCE-Compute CCE-Observability CCE-Security CCE-Backup CCE-Chaos CCE-Extensions CCE-CostGuardrails CCE-PowerSwitch
