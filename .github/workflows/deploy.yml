name: Deploy

# PRODUCTION deploys are intentionally manual-only — click "Run workflow" in
# the Actions tab, or use `gh workflow run deploy.yml`. This is the A5
# approval gate: GitHub Free org plan does not allow required-reviewer
# protection rules on private repos, so we substitute manual-dispatch.
#
# STAGING is continuous: a merge into `staging` deploys itself, so QA and
# development fixes reach https://staging.pgnos.ai without a manual step. That
# is safe to automate precisely because it is not production — the environment
# is Tier 0, the ECS circuit breaker rolls a bad task back on its own, and the
# source guard still refuses any staging deploy that is not from
# refs/heads/staging. Production remains dispatch-plus-typed-confirmation.
on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging
      tier:
        description: 'Deploy tier (0/1/2/3) — must match env. Ignored for staging, which is pinned to Tier 0.'
        required: false
        default: '3'
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: ''

# Only one deploy at a time per branch.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  # Actions repository variable, never a tracked literal:
  #   gh variable set AWS_ACCOUNT_ID --body "<your-aws-account-id>"
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  # A push can only reach this workflow from `staging` (see the `on:` filter),
  # so a push event is always a staging deploy. Dispatch keeps its old default.
  TARGET_ENV: ${{ github.event_name == 'push' && 'staging' || github.event.inputs.env || 'prod' }}
  # env-specific values are resolved per-step from TARGET_ENV.
  # Staging is pinned to Tier 0 and ignores the `tier` input: the dispatch
  # default is '3' (Enterprise, ~$306/mo), which a careless staging dispatch
  # would otherwise provision. Production still honours the input.
  CCE_TIER: ${{ (github.event_name == 'push' || github.event.inputs.env == 'staging') && '0' || github.event.inputs.tier || '3' }}

jobs:
  source-guard:
    name: Validate deployment source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate deployment source
        env:
          # TARGET_ENV is inherited from the workflow-level env block, which
          # already resolves push -> staging. It is deliberately NOT overridden
          # here: the previous `${{ github.event.inputs.env }}` override reached
          # the guard as an empty string on a push and failed closed.
          GITHUB_REF: ${{ github.ref }}
        run: node scripts/ci/deploy-source-guard.mjs

  verify:
    name: Typecheck + Unit Tests
    needs: source-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Build + CDK Deploy + Smoke
    needs: [source-guard, verify]
    # A push to `staging` is its own approval; production still requires the
    # typed confirmation.
    if: github.event_name == 'push' || inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    # MUST resolve the same way TARGET_ENV does: on a push the dispatch input
    # is empty, and keying off it would select the `production` environment and
    # hand a staging deploy production's variables.
    # The condition is spelled out from the `github` context rather than reusing
    # `env.TARGET_ENV`, because the `env` context is NOT available in
    # `jobs.<job_id>.environment` — referencing it there makes the whole
    # workflow file invalid, and GitHub reports that as a 0-second run failure
    # with no jobs rather than as a syntax error.
    environment: ${{ (github.event_name == 'push' || github.event.inputs.env == 'staging') && 'staging' || 'production' }}
    # A cold QEMU arm64 orchestrator build can consume almost 60 minutes by
    # itself. Paperclip then needs up to 35 minutes for its native build plus
    # migration, CDK rollout and smoke verification. Bound the whole deploy,
    # but leave enough room for the complete first-deploy path.
    timeout-minutes: 150
    # Staging stays Tier 0 but provisions Paperclip so the engine is validated
    # before production. Keep this deploy-only: the verify job must test the
    # repository's default, unconfigured tier behaviour.
    env:
      CCE_PAPERCLIP_PROVISION_ENV_OVERRIDE: ${{ (github.event_name == 'push' || github.event.inputs.env == 'staging') && '1' || '' }}
    steps:
      - name: Resolve env-specific values
        id: cfg
        run: |
          if [ "$TARGET_ENV" = "staging" ]; then
            # Match CDK constants: APP_NAME_SUFFIX=staging produces
            # app slug `claudeclaw-staging`, so the orchestrator repo
            # is `claudeclaw-staging-orchestrator` (suffix in the
            # middle, not at the end). IAM grant in iam-stack.ts
            # already matches this shape via `claudeclaw-*-orchestrator`.
            echo "ecr_repo=claudeclaw-staging-orchestrator" >> "$GITHUB_OUTPUT"
            echo "paperclip_ecr_repo=claudeclaw-staging-paperclip" >> "$GITHUB_OUTPUT"
            echo "stack_name=CCE-STAGING" >> "$GITHUB_OUTPUT"
            # Staging is infra-only. DOMAIN_NAME MUST stay empty: there is no
            # Route 53 hosted zone and no ACM certificate in this account, so a
            # non-empty value sends compute-stack.ts into HostedZone.fromLookup
            # and the deploy fails at synth. It would also flip the ALB
            # internet-facing. staging.pgnos.ai is published by a Cloudflare
            # Tunnel, never by the ALB.
            echo "public_host=" >> "$GITHUB_OUTPUT"
            echo "cluster=claudeclaw-staging-cluster" >> "$GITHUB_OUTPUT"
            echo "service=claudeclaw-staging-service" >> "$GITHUB_OUTPUT"
            # Suffix goes in the middle, matching buildPublicTunnelSecretName('staging').
            echo "tunnel_secret=claudeclaw-staging-public-tunnel" >> "$GITHUB_OUTPUT"
          else
            echo "ecr_repo=claudeclaw-orchestrator" >> "$GITHUB_OUTPUT"
            echo "paperclip_ecr_repo=claudeclaw-paperclip" >> "$GITHUB_OUTPUT"
            echo "stack_name=CCE" >> "$GITHUB_OUTPUT"
            # Empty for the same reason as staging: no Route 53 zone and no ACM
            # cert in this account. app.pgnos.ai is published by the Cloudflare
            # Tunnel and the live prod ALB is `internal`.
            echo "public_host=" >> "$GITHUB_OUTPUT"
            echo "cluster=claudeclaw-cluster" >> "$GITHUB_OUTPUT"
            echo "service=claudeclaw-service" >> "$GITHUB_OUTPUT"
            echo "tunnel_secret=claudeclaw-public-tunnel" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Rank 7. The Paperclip gate, emitted ONCE from `paperclipProvisioned`
      # — the predicate infra/bin/app.ts actually deploys from, which is the
      # tier OR the environment-scoped override in the env block at the top.
      # Four steps below used to re-derive it as `CCE_TIER != '0'`, which agrees
      # with the table only because Tier 0 is the sole false today: the day
      # another tier opts out, CI would build and migrate an engine CDK does not
      # provision — and on staging, which is Tier 0 AND provisions, it would get
      # that backwards today.
      - name: Resolve the Paperclip tier gate
        id: tiergate
        run: npx tsx scripts/ci/tier-gate.ts

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ClaudeClawGitHubDeploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy-${{ github.run_id }}

      # Paperclip's ECR, CodeBuild, secret-population and migration calls run
      # before the main `cdk deploy --all`. Apply this environment's additions
      # to the shared deploy role first, in the same job, so a newly introduced
      # grant is available to the first workflow run that consumes it.
      - name: Apply IAM grants before Paperclip operations
        if: steps.tiergate.outputs.paperclip_enabled == '1'
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          DOMAIN_NAME: ${{ steps.cfg.outputs.public_host }}
          CCE_DEPLOY_MODE: infra-only
          CDK_STACK_NAME: ${{ steps.cfg.outputs.stack_name }}
          DEPLOY_TIER: ${{ env.CCE_TIER }}
          CCE_TIER: ${{ env.CCE_TIER }}
          CCE_NAME_SUFFIX: ${{ env.TARGET_ENV == 'staging' && 'staging' || '' }}
          CCE_CICD_ENABLED: '1'
          CCE_PAPERCLIP_TEARDOWN: ''
          CCE_GITHUB_OWNER: ${{ github.repository_owner }}
          CCE_GITHUB_REPO: ${{ github.event.repository.name }}
          CCE_GITHUB_OWNER_ID: ${{ vars.CCE_GITHUB_IMMUTABLE_SUBJECT == '1' && github.repository_owner_id || '' }}
          CCE_GITHUB_REPO_ID: ${{ vars.CCE_GITHUB_IMMUTABLE_SUBJECT == '1' && github.repository_id || '' }}
          CCE_GITHUB_DEPLOY_REFS: refs/heads/production,refs/heads/staging
          CCE_GITHUB_DEPLOY_ENVIRONMENTS: production,staging
        run: |
          npx cdk deploy "${{ steps.cfg.outputs.stack_name }}-Iam" \
            --exclusively \
            --require-approval never
          # Create the unchanged secret schema first. The Populate step can
          # then merge-add company_id and lock_auditor_key without CloudFormation replacing live
          # credentials during an upgrade.
          npx cdk deploy \
            "${{ steps.cfg.outputs.stack_name }}-Storage" \
            "${{ steps.cfg.outputs.stack_name }}-Secrets" \
            --exclusively \
            --require-approval never

      - name: Login to ECR
        id: ecr
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          echo "registry=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repo exists
        env:
          ECR_REPO: ${{ steps.cfg.outputs.ecr_repo }}
          PAPERCLIP_ECR_REPO: ${{ steps.cfg.outputs.paperclip_ecr_repo }}
          # Spelled PAPERCLIP_TIER_ENABLED, not PAPERCLIP_ENABLED: the plan and
          # its audit discuss a `PAPERCLIP_ENABLED` router flag at length, and
          # that flag was never built — it was collapsed into
          # CCE_PAPERCLIP_ENABLED (src/lib/missions/mission-acl.ts). A bare
          # PAPERCLIP_ENABLED here would make a grep look like the router flag
          # shipped. This is only "does this TIER provision the substrate".
          PAPERCLIP_TIER_ENABLED: ${{ steps.tiergate.outputs.paperclip_enabled }}
        run: |
          # scripts/deploy.ts does this for local deploys; the CI
          # workflow never did, so the first staging deploy hit a 403
          # trying to push to a non-existent repo. Idempotent.
          #
          # CI does NOT run scripts/deploy.ts, it runs `cdk deploy --all`
          # directly, so the deploy driver has TWO homes. A repo created in
          # only one of them is absent on the path that reaches staging.
          #
          # "Does not exist" and "I am not allowed to look" must not be the
          # same answer. `2>/dev/null` used to make them one: an AccessDenied
          # on describe fell through to create-repository, which then failed
          # with a second AccessDenied naming the wrong API. Same failure mode
          # as the connector-readiness probe below, whose comment records what
          # a swallowed AccessDenied cost on 2026-08-14.
          ensure_repo() {
            set +e
            out=$(aws ecr describe-repositories --repository-names "$1" --region "$AWS_REGION" --no-cli-pager 2>&1)
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "ECR repository already exists: $1"
              return 0
            fi
            case "$out" in
              *RepositoryNotFoundException*) ;;
              *)
                echo "::error::Cannot read ECR repository $1; refusing to guess that it is missing."
                echo "$out" >&2
                echo "The deploy role needs ecr:DescribeRepositories on $1." >&2
                echo "Grants live in infra/lib/iam-stack.ts (cicdRole, sid EcrPushAppImages /" >&2
                echo "EcrCreateAppRepos) and are applied by the CDK deploy LATER IN THIS JOB," >&2
                echo "so a new repo pattern must ship in an earlier deploy than the flag that" >&2
                echo "uses it. cicdRole is created only by the PROD IAM stack." >&2
                exit 1
                ;;
            esac
            echo "Creating ECR repository: $1"
            aws ecr create-repository --repository-name "$1" --image-scanning-configuration scanOnPush=true --image-tag-mutability MUTABLE --region "$AWS_REGION" --no-cli-pager
          }
          ensure_repo "$ECR_REPO"
          # Paperclip work engine (ADR 0010): the SAME gate the substrate
          # stacks use since Phase 9 — TierShape.paperclipEnabled, resolved
          # once by the "Resolve the Paperclip tier gate" step above rather
          # than re-spelled as a tier comparison here. A tier that provisions
          # no Paperclip needs no repo to push an image into.
          if [ "$PAPERCLIP_TIER_ENABLED" = "1" ]; then
            ensure_repo "$PAPERCLIP_ECR_REPO"
          fi

      - name: Compute image tag
        id: tag
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # Fargate task definition runs on linux/arm64 (Graviton). The
      # ubuntu-latest runner is amd64, so we use QEMU + buildx to
      # cross-compile. Without this, ECS tasks fail to start with
      # "exec format error" and the deployment circuit breaker trips.
      #
      # ORCHESTRATOR IMAGE ONLY. The Paperclip image below is deliberately NOT
      # built here: it goes through the same native ARM64 CodeBuild path the
      # local deploy driver uses, so that artifact has one build mechanism
      # rather than two. See the step's comment for why.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build + Push (linux/arm64)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ steps.tag.outputs.sha }}
          ECR_REPO: ${{ steps.cfg.outputs.ecr_repo }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg DEPLOY_TIER="$CCE_TIER" \
            -t "$REGISTRY/$ECR_REPO:$SHA" \
            -t "$REGISTRY/$ECR_REPO:latest" \
            --provenance=false \
            --push \
            -f Dockerfile \
            .

      # Mirrors the Paperclip image build in scripts/deploy.ts phase a (Phase
      # 1.5, ADR 0010) by running THE SAME CODE, not a hand-mirrored copy of
      # it. CI does NOT run scripts/deploy.ts - it runs `npx cdk deploy --all`
      # and hand-mirrors every step - and this is the one step where
      # hand-mirroring changed the ARTIFACT'S PROVENANCE rather than just its
      # wording. The previous version cross-built vendor/paperclip/Dockerfile
      # with QEMU-emulated `docker buildx` on this amd64 runner while the local
      # driver used the native ARM64 CodeBuild path in
      # scripts/lib/lifecycle/cloud-build.ts. Same Dockerfile, two mechanisms,
      # so the arm64 guarantee, the base-image pull and the whole build
      # environment differed between the path that gets exercised locally and
      # the path that actually reaches staging and production. Emulation was
      # also wrong on its own merits here: that Dockerfile runs apt-get and
      # then a full `tsc` over the entire Paperclip server (a 12,670-line route
      # module, a 212 KB generated OpenAPI, ~116 schema files) at 5-20x under
      # QEMU, with no layer cache on a fresh runner.
      #
      # scripts/ci/paperclip-image.ts is a thin CLI over that same module, not
      # a second implementation. It computes the SAME content-addressed tag
      # (contentImageTag: git's own tree hash for vendor/paperclip, so an app
      # commit that cannot alter this image does not rebuild it), performs the
      # SAME skip-if-already-present ECR probe with the same refusal to read an
      # AccessDenied as absence, and calls the SAME runCloudBuild with
      # `pushLatest: false` - no floating :latest in a repo whose only
      # legitimate consumer is a task definition pinned to the digest.
      #
      # The arm64 gate is unchanged and still the thing that stops a
      # wrong-platform image being pushed AT ALL: the buildspec's
      # `test "$ARCH" = "arm64"` runs INSIDE the build, on a native ARM host,
      # between `docker build` and `docker push`. It is not ceremony - the
      # pinned Paperclip base is a multi-arch INDEX, so a builder on the wrong
      # platform succeeds quietly and produces amd64 that crash-loops on
      # Fargate with "exec format error".
      #
      # Same gate as the ECR repo create above, and since Phase 9 that gate is
      # `paperclipProvisioned`: the tier, OR the environment-scoped override. A
      # configuration that provisions no Paperclip never runs this step and so
      # creates no CodeBuild project, starts no build and pushes no image.
      # NOTE for this repository's own pipeline: staging runs at CCE_TIER 0 but
      # carries CCE_PAPERCLIP_PROVISION_ENV_OVERRIDE=1 (see the deploy job env
      # above), so staging DOES build the image and DOES provision the substrate —
      # it is the environment the engine is validated in, which is the whole
      # point of the override. A Tier 0 install without it builds nothing.
      #
      # IAM. This step needs cicdRole's PaperclipCloudBuild* statements
      # (infra/lib/iam-stack.ts) to stage the source zip, create/start the
      # CodeBuild project and pass its role. The exclusive IAM deploy above
      # applies this environment's grants before any Paperclip consumer runs,
      # including on the first workflow run.
      #
      # timeout-minutes is belt and braces: runCloudBuild gives up at 35
      # minutes and the CodeBuild project times out at 30, so this only catches
      # a hung AWS CLI.
      - name: Build + Push Paperclip (native ARM64 CodeBuild)
        id: paperclipimg
        if: steps.tiergate.outputs.paperclip_enabled == '1'
        timeout-minutes: 45
        env:
          PAPERCLIP_ECR_REPO: ${{ steps.cfg.outputs.paperclip_ecr_repo }}
          # Selects THIS environment's state bucket through the same
          # resolveStateNames() every other lifecycle tool uses. Must match the
          # CCE_NAME_SUFFIX the CDK deploy step below passes, or the source zip
          # is staged in the other environment's bucket.
          CCE_NAME_SUFFIX: ${{ env.TARGET_ENV == 'staging' && 'staging' || '' }}
          # Forwarded as the shared buildspec's --build-arg. The vendored
          # Dockerfile declares no matching ARG, so it is inert here - which is
          # also why it is correctly absent from the content tag.
          DEPLOY_TIER: ${{ env.CCE_TIER }}
        run: npx tsx scripts/ci/paperclip-image.ts

      # Mirrors the readiness gate in scripts/deploy.ts. The cloudflared
      # connector is an ESSENTIAL container that reads the `token` field of the
      # tunnel secret, so attaching it before a real token exists means ECS
      # cannot resolve the secret, the container never starts, and the rollout
      # fails. First deploy therefore creates the secret alone; the connector
      # joins on a later deploy, once `npm run public:setup` has written the
      # token. Only the EXISTENCE of the ready stage is checked — never the
      # value behind it.
      #
      # This block used to end "any failure here (including AccessDenied) leaves
      # the output empty, i.e. 'not ready', which is the safe direction." That
      # was only safe against ONE risk — attaching a connector to an empty token
      # — and catastrophic against the other, which is tearing the connector out
      # of an environment that is already serving traffic on it. Both directions
      # have to be safe, so an unreadable probe is now a hard failure.
      - name: Public connector readiness
        id: pubready
        if: vars.CCE_PUBLIC_ACCESS == '1'
        env:
          SECRET_ID: ${{ steps.cfg.outputs.tunnel_secret }}
        run: |
          set -uo pipefail
          # "Not ready" and "I could not find out" must not be the same answer.
          # On 2026-08-14 this step ran at 15:54:05Z, six minutes BEFORE the same
          # deploy granted the role secretsmanager:DescribeSecret at 16:00:04Z.
          # `2>/dev/null` swallowed the AccessDeniedException, the probe said
          # "not ready", CDK emitted a task definition with no cloudflared
          # sidecar, CloudFormation applied it to a healthy production service,
          # the run went green, and app.pgnos.ai served Cloudflare 1033 for nine
          # hours. Capture the error and stop instead of guessing.
          set +e
          stages=$(aws secretsmanager describe-secret \
                     --secret-id "$SECRET_ID" \
                     --region "$AWS_REGION" \
                     --query VersionIdsToStages \
                     --output text 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Could not read $SECRET_ID (exit $rc); refusing to guess readiness."
            echo "$stages" >&2
            echo "An unreadable probe is what removed the cloudflared sidecar from" >&2
            echo "production on 2026-08-14. Grant the deploy role" >&2
            echo "secretsmanager:DescribeSecret on $SECRET_ID and re-run." >&2
            exit 1
          fi
          if printf '%s' "$stages" | grep -q 'CCE-PUBLIC-READY'; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
            echo "Connector token present: attaching the cloudflared sidecar."
          else
            echo "ready=" >> "$GITHUB_OUTPUT"
            echo "No connector token yet for $SECRET_ID: deploying the secret only."
            echo "Run 'npm run public:setup -- --env=${TARGET_ENV}', then re-run this deploy."
            echo "That path drops the public entrypoint, so synth will also demand"
            echo "CCE_PUBLIC_BOOTSTRAP=1 (see assertPublicEntrypointRenderable)."
          fi

      # Populate the Paperclip secret BEFORE the CDK deploy that starts the
      # service. `put-secret-value` appeared ZERO times in this workflow until
      # now (ledger A26): CI populated no secrets at all, for any feature. The
      # Paperclip and Compute inject JSON fields from this secret, and a missing
      # field is a ResourceInitializationError at task START.
      #
      # Ordering. The early prerequisite step deploys Storage + Secrets first,
      # preserving CloudFormation's original Paperclip schema. This step then
      # merge-adds company_id and lock_auditor_key before Compute references them. The Aurora secret is
      # created by CCE-Database, which only exists once the feature is armed,
      # so on the FIRST deploy of a standard install there is nothing to
      # compose a URL from. The migrate step below sees the absence and arms
      # CCE_PAPERCLIP_BOOTSTRAP for the main CDK deploy, which lands the stack
      # with DesiredCount 0. The completion step then composes the URL, migrates,
      # and starts it in this same workflow run. No operator variable is needed.
      #
      # Failure directions, both stated deliberately (M33):
      #  - missing after the early prerequisite deploy: HARD FAIL. Compute now
      #    depends on the additive company_id and lock_auditor_key fields.
      #  - a secret that exists but cannot be READ or WRITTEN (AccessDenied):
      #    HARD FAIL. This is the corrected cloudflared idiom directly above:
      #    "not ready" and "I could not find out" must not be the same answer.
      #    Failing here changes nothing; guessing would start a service against
      #    REPLACE_ME.
      #  - a value already present: LEAVE IT. Every write is a read-modify-write
      #    merge, because PutSecretValue swaps the whole string and would
      #    otherwise wipe the company id and reconciler, agent and dispatch
      #    keys that scripts/paperclip-bootstrap.ts minted against the running
      #    instance.
      #
      # No secret value is ever echoed: values move through jq and a file, and
      # only FIELD NAMES are printed.
      #
      # M34. The deploy role needs secretsmanager:GetSecretValue and
      # PutSecretValue on claudeclaw[-staging]/paperclip*. Those statements
      # exist in both environment branches of infra/lib/iam-stack.ts and the
      # exclusive IAM deploy above applies them before this step. Read failures
      # still fail closed; the code is a plan and the live role is the fact.
      - name: Populate Paperclip secret
        if: steps.tiergate.outputs.paperclip_enabled == '1'
        env:
          APP_SLUG: ${{ env.TARGET_ENV == 'staging' && 'claudeclaw-staging' || 'claudeclaw' }}
          # Optional first-write override. Secrets Manager owns the value once
          # populated; local lifecycle deploys and CI both preserve that owner.
          PAPERCLIP_BETTER_AUTH_SECRET: ${{ secrets.PAPERCLIP_BETTER_AUTH_SECRET }}
        run: |
          set -uo pipefail
          SECRET="/$APP_SLUG/paperclip"
          DB_SECRET="/$APP_SLUG/paperclip-db"
          umask 077
          read_secret() {
            set +e
            out=$(aws secretsmanager get-secret-value --secret-id "$1" \
                    --region "$AWS_REGION" --query SecretString --output text 2>&1)
            rc=$?
            set -e
            printf '%s' "$out"
            return $rc
          }

          if ! current=$(read_secret "$SECRET"); then
            case "$current" in
              *ResourceNotFoundException*)
                echo "::error::$SECRET is missing after the early Storage/Secrets deploy."
                echo "Refusing to deploy Compute with an unresolved company_id field." >&2
                exit 1
                ;;
              *)
                echo "::error::Could not read $SECRET; refusing to guess."
                echo "The deploy role needs secretsmanager:GetSecretValue and PutSecretValue" >&2
                echo "on $SECRET and $DB_SECRET, plus kms:Decrypt and kms:GenerateDataKey" >&2
                echo "on their customer-managed data key. Read the LIVE role before granting (M34)." >&2
                exit 1
                ;;
            esac
          fi
          printf '%s' "$current" > current.json
          cp current.json before.json

          # Additive schema migration. Never put company_id or lock_auditor_key in the CDK
          # SecretString: changing that template on an upgrade would publish a
          # placeholder-only version and erase the live database URL and keys.
          # A real id written by paperclip-bootstrap always wins.
          if [ "$(jq 'has("company_id")' current.json)" != "true" ]; then
            jq '.company_id = "REPLACE_ME"' current.json > next.json
            mv next.json current.json
            echo "added company_id placeholder without replacing live fields"
          fi
          if [ "$(jq 'has("lock_auditor_key")' current.json)" != "true" ]; then
            jq '.lock_auditor_key = "REPLACE_ME"' current.json > next.json
            mv next.json current.json
            echo "added lock_auditor_key placeholder without replacing live fields"
          fi

          # better_auth_secret has exactly ONE owner: this installation's
          # Secrets Manager field. PAPERCLIP_BETTER_AUTH_SECRET and the value
          # `npm run setup` stores in .env are optional FIRST-WRITE seeds only.
          #
          # This step used to mint its own with `openssl rand -hex 32` when the
          # field was REPLACE_ME. That made TWO independent minters for one
          # value: CI would mint, then the next LOCAL deploy would merge .env's
          # different value over it, silently rotating the auth secret and
          # logging every Paperclip user out — while both sides' comments
          # claimed it was "minted once, then never touched". A value no
          # operator can see and no second driver can reproduce is not owned.
          #
          # The revert was correct until the second writer was fixed. Phase (b)
          # is now write-if-absent for this field, so neither a stale .env nor a
          # later repo secret can rotate a populated installation. CI can safely
          # seed a missing field and Secrets Manager remains the single owner.
          if [ "$(jq -r '.better_auth_secret // "REPLACE_ME"' current.json)" = "REPLACE_ME" ]; then
            if [ -n "${PAPERCLIP_BETTER_AUTH_SECRET:-}" ]; then
              printf '%s' "$PAPERCLIP_BETTER_AUTH_SECRET" > auth.txt
              jq --rawfile v auth.txt '.better_auth_secret = $v' current.json > next.json
              mv next.json current.json
              rm -f auth.txt
              echo "seeded better_auth_secret from the optional repo secret (value not shown)"
            else
              openssl rand -hex 32 | tr -d '\r\n' > auth.txt
              jq --rawfile v auth.txt '.better_auth_secret = $v' current.json > next.json
              mv next.json current.json
              rm -f auth.txt
              echo "minted the per-install better_auth_secret from 32 random bytes (value not shown)"
            fi
          fi
          if [ "$(jq '(.better_auth_secret // "") != "REPLACE_ME" and ((.better_auth_secret // "") | length) >= 32' current.json)" != "true" ]; then
            echo "::error::$SECRET has no valid better_auth_secret; refusing this deploy." >&2
            exit 1
          fi

          # database_url: composed from the Aurora-generated secret, which is
          # RDS-managed and carries no URL form. Absent on the first armed
          # deploy, when CCE-Database has not been created yet.
          #
          # ?sslmode=require is load-bearing, not decoration. Aurora runs the
          # default parameter group (rds.force_ssl=1) and the image's driver
          # connects in plaintext unless the URL says otherwise; probed
          # 2026-08-21 against a hostssl-only Postgres 17, the migration fails
          # "no pg_hba.conf entry ... no encryption" without it and exits 0
          # with it. `require` not `verify-full` — the image carries no RDS CA
          # bundle. This is a HAND MIRROR of PAPERCLIP_DB_URL_TLS_SUFFIX in
          # scripts/deploy.ts, because CI never runs that file (M27); the two
          # are pinned together by a test in infra/lib/paperclip-stack.test.ts.
          if db=$(read_secret "$DB_SECRET"); then
            printf '%s' "$db" > db.json
            if [ "$(jq -r '(.host // "") != "" and (.username // "") != "" and (.password // "") != ""' db.json)" = "true" ]; then
              jq -s '.[0] + {database_url: ("postgres://" + (.[1].username | @uri) + ":"
                     + (.[1].password | @uri) + "@" + .[1].host + ":"
                     + ((.[1].port // 5432) | tostring) + "/" + (.[1].dbname // "paperclip")
                     + "?sslmode=require")}' \
                 current.json db.json > next.json
              mv next.json current.json
              echo "composed database_url from $DB_SECRET"
            else
              echo "::warning::$DB_SECRET has no host/username/password yet; database_url unchanged"
            fi
            rm -f db.json
          else
            case "$db" in
              *ResourceNotFoundException*)
                echo "$DB_SECRET does not exist yet; Aurora lands in this deploy."
                ;;
              *)
                echo "::error::Could not read $DB_SECRET; refusing to guess."
                echo "$db" >&2
                exit 1
                ;;
            esac
          fi

          if [ "$(jq -S -c . current.json)" = "$(jq -S -c . before.json)" ]; then
            echo "$SECRET already current; nothing written."
          else
            aws secretsmanager put-secret-value --secret-id "$SECRET" \
              --secret-string "file://current.json" --region "$AWS_REGION" \
              --no-cli-pager > /dev/null
            echo "wrote $SECRET (fields: $(jq -r 'keys | join(", ")' current.json))"
          fi
          rm -f current.json before.json

      # Run Paperclip's schema migration BEFORE the CDK deploy that rolls the
      # service. This step is the CI half of `scripts/deploy.ts` phase b.5.
      #
      # WHY IT HAS TO EXIST HERE AT ALL (M27, the fourth time). The deploy
      # driver has TWO homes and CI is not `scripts/deploy.ts`: this workflow
      # hand-mirrors each phase and then runs `npx cdk deploy --all`. Phase b.5
      # lived only in the script, so on the one path that actually reaches
      # staging and production the migration simply never ran. The service
      # deliberately does NOT carry PAPERCLIP_MIGRATION_AUTO_APPLY, so nothing
      # else would have migrated it either: a CI deploy with
      # CCE_PAPERCLIP_BOOTSTRAP clear would have started an essential
      # container against an empty schema, failed its rollout, and left
      # CCE-Paperclip in UPDATE_ROLLBACK next to RETAIN + deletionProtection
      # substrate.
      #
      # ORDERING. Before `CDK deploy`, because that deploy is what sets
      # DesiredCount 1 and CloudFormation waits for the service to reach steady
      # state; migrating after it is migrating after the rollout has already
      # failed. On upgrades this step uses the task definition the previous
      # deploy created. On a fresh install no task definition exists yet, so it
      # arms bootstrap and the completion step uses the definition the main
      # deploy creates, all within this workflow run:
      #
      #   before main deploy -> this step finds no stack, exits 0, and sets
      #     bootstrap=1.
      #     Aurora, EFS and the whole Paperclip stack land with DesiredCount 0.
      #     No task starts, nothing fails, and the migration task definition
      #     now exists.
      #   after main deploy -> the completion step composes database_url,
      #     migrates, clears bootstrap, and redeploys Paperclip to start it.
      #
      # NAMED CONSEQUENCE, not hidden: an image bump that INTRODUCES a
      # migration is the same two-deploy shape, because this step runs the
      # previous digest's migrate task definition. Ship the new image with
      # CCE_PAPERCLIP_BOOTSTRAP=1 (the operator variable still works and still
      # wins), then clear it. `vendor/paperclip` is
      # content-tagged and changes only when its Dockerfile or its patch
      # changes, so this is rare and deliberate rather than routine.
      #
      # M33, all three directions:
      #  - stack/secret AFFIRMATIVELY not there (first install): defer_bootstrap
      #    — exit 0 and arm DesiredCount 0 for this job's CDK deploy. The
      #    completion step resumes after it. Safe precisely because nothing is
      #    running yet, so the flag has no service to scale down.
      #  - stack there but its migration outputs are not: plain defer — exit 0
      #    and change nothing. Deliberately does NOT arm the flag: a stack that
      #    exists may have a running service.
      #  - stack unreadable, or the migration job exits non-zero: HARD FAIL,
      #    BEFORE `CDK deploy`. The running service keeps running on its
      #    current task definition and this workflow has changed nothing. It
      #    never removes a resource, never scales one down, and never lets the
      #    deploy proceed on a guess.
      #
      # The exit code alone is deliberately NOT trusted as proof that Aurora
      # was migrated, so database_url is verified non-empty and
      # non-placeholder here, before the job is started. Only its PRESENCE is
      # checked; the value is never bound to a variable and never printed.
      #
      # That guard was written against a suspected false green: the resolver
      # falling back to an EMBEDDED postgres when DATABASE_URL is empty and
      # still exiting 0. PROBED 2026-08-21 and the suspicion was WRONG in the
      # safe direction — the fallback is reached but exits 1, because the
      # container runs as root and embedded-postgres refuses to. The check
      # stays anyway: the thing that makes it exit 1 is a root check, not a
      # refusal to migrate the wrong database, so it stops protecting anything
      # the day the task definition gains a non-root `user`.
      #
      # What the same probe DID prove load-bearing is ?sslmode=require on the
      # composed URL (see the step above). Without it this job cannot connect
      # to a force_ssl Aurora at all.
      - name: Migrate Paperclip database
        id: pcmigrate
        if: steps.tiergate.outputs.paperclip_enabled == '1'
        env:
          APP_SLUG: ${{ env.TARGET_ENV == 'staging' && 'claudeclaw-staging' || 'claudeclaw' }}
          STACK: ${{ steps.cfg.outputs.stack_name }}-Paperclip
        run: |
          set -uo pipefail
          SECRET="/$APP_SLUG/paperclip"

          # RANK 1. There is nothing to migrate YET — not "the migration
          # failed", which is always a hard exit 1 further down. Since Phase 9
          # made the substrate part of a standard install, this is the
          # GUARANTEED state of a first deploy at a tier that provisions it,
          # and this step runs BEFORE `CDK deploy`. Exiting 1 here therefore
          # blocked the entire deploy — orchestrator included — on every first
          # run, and the next run deferred identically: a permanent deadlock
          # until an operator set a variable whose own documentation said
          # "FIRST ARMED DEPLOY ONLY", a concept Phase 9 deleted.
          #
          # So exit 0 and carry on with the deploy, printing what happens next.
          #
          # defer_bootstrap() additionally arms CCE_PAPERCLIP_BOOTSTRAP for the
          # `CDK deploy` step below, so the service lands with DesiredCount 0
          # and no task starts against an unmigrated database. It is used ONLY
          # on branches that have established AFFIRMATIVELY that the stack
          # cannot be running — the secret CCE-Secrets creates is absent, or
          # Aurora has never been composed into it, or the stack does not
          # exist. On those branches there is no service for DesiredCount 0 to
          # scale down, which is what keeps this clear of M33: an unreadable
          # probe still exits 1, and "I could not find out" is never read as
          # "not ready".
          defer() {
            echo "$1"
            echo "Nothing to migrate yet. This deploy continues; re-run it once"
            echo "$STACK has published its migration outputs."
            exit 0
          }

          defer_bootstrap() {
            echo "$1"
            echo "First install: the CDK deploy in this job will land $STACK with"
            echo "DesiredCount 0, so no task starts against an unmigrated database."
            echo "This workflow then composes database_url, migrates the schema,"
            echo "and starts the service in its completion step."
            echo "bootstrap=1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # 1. database_url must actually be there. The step above composes it;
          #    an EMPTY field would silently migrate a throwaway embedded
          #    postgres and exit 0.
          set +e
          raw=$(aws secretsmanager get-secret-value --secret-id "$SECRET" \
            --region "$AWS_REGION" --query SecretString --output text 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            case "$raw" in
              *ResourceNotFoundException*)
                # CCE-Secrets creates this secret, so its absence means the
                # deploy that creates CCE-Paperclip has not run either.
                defer_bootstrap "$SECRET does not exist yet."
                ;;
              *)
                echo "::error::Could not read $SECRET; refusing to guess." >&2
                echo "The deploy role needs secretsmanager:GetSecretValue on $SECRET." >&2
                exit 1
                ;;
            esac
          fi
          have=$(printf '%s' "$raw" | jq -r 'if (.database_url // "") == "" or .database_url == "REPLACE_ME" then "no" else "yes" end')
          unset raw
          if [ "$have" != "yes" ]; then
            # The step above composes database_url from the Aurora secret and
            # skips only when THAT does not exist, i.e. CCE-Database has never
            # deployed. No Paperclip task can be healthy without it either.
            defer_bootstrap "$SECRET has no database_url yet; Aurora has not been composed into it."
          fi

          # 2. Locate the migration job from the LIVE stack outputs. The same
          #    four outputs scripts/deploy.ts reads, from CloudFormation rather
          #    than a gitignored cdk-outputs.json, so the lookup answers
          #    identically on a runner, a fresh clone and a laptop.
          set +e
          out=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --region "$AWS_REGION" --query 'Stacks[0].Outputs' --output json 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            case "$out" in
              *ValidationError*)
                defer_bootstrap "$STACK does not exist yet, so there is no migration task definition."
                ;;
              *)
                echo "::error::Could not read $STACK; refusing to guess." >&2
                echo "$out" >&2
                echo "The deploy role needs cloudformation:DescribeStacks. An unreadable" >&2
                echo "probe must never be treated as 'not deployed' (2026-08-14)." >&2
                exit 1
                ;;
            esac
          fi
          get() {
            printf '%s' "$out" | jq -r --arg k "$1" '(.[]? | select(.OutputKey==$k) | .OutputValue) // ""'
          }
          CLUSTER=$(get PaperclipClusterName)
          FAMILY=$(get PaperclipMigrateTaskDefFamily)
          SUBNETS=$(get PaperclipMigrateSubnets)
          SG=$(get PaperclipMigrateSecurityGroup)
          if [ -z "$CLUSTER" ] || [ -z "$FAMILY" ] || [ -z "$SUBNETS" ] || [ -z "$SG" ]; then
            defer "$STACK exists but has not published the migration outputs yet."
          fi

          # 3. Run it, wait, read the container exit code. Nothing is passed as
          #    a RunTask override: overrides are readable verbatim in
          #    `aws ecs describe-tasks`, and DATABASE_URL reaches the container
          #    as an ECS secret instead.
          echo "Running $FAMILY on $CLUSTER"
          TASK=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$FAMILY" \
            --launch-type FARGATE \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --region "$AWS_REGION" \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$TASK" ] || [ "$TASK" = "None" ]; then
            echo "::error::Paperclip migration returned no task ARN." >&2
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK" --region "$AWS_REGION"
          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
            --region "$AWS_REGION" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT" != "0" ]; then
            REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
              --region "$AWS_REGION" --query 'tasks[0].stoppedReason' --output text)
            echo "::error::Paperclip migration exited $EXIT ($REASON). Refusing to deploy." >&2
            echo "Logs: aws logs tail /$APP_SLUG/paperclip --log-stream-name-prefix migrate" >&2
            exit 1
          fi
          echo "Paperclip schema is migrated."

      # THE MONEY, PRINTED ON THE ONE RUN THAT SPENDS IT.
      #
      # Since Phase 9 the Paperclip substrate installs BY DEFAULT, so the next
      # `cdk deploy --all` of any tier that provisions it silently creates an
      # Aurora cluster, an EFS filesystem and an always-on 2 vCPU / 4 GB Fargate
      # task -- on a cluster that is RETAIN + deletionProtection: true and so
      # not casually reversible. The LOCAL driver names that figure on its
      # confirmation screen (scripts/lib/cost-gate.ts, resourceSummary +
      # estimateLine). This job runs `cdk deploy --all` unattended and showed a
      # human nothing at all, which is the gap.
      #
      # IT IS A NOTICE, NEVER A GATE. `continue-on-error: true` plus a `|| exit 0`
      # on the estimator: the install path stays unattended, and a broken or
      # renamed estimator must never be the thing that stops a deploy. It writes
      # to $GITHUB_STEP_SUMMARY only -- it prompts nothing and blocks nothing.
      #
      # WHEN. Only when the substrate is being NEWLY provisioned: the tier
      # provisions it (`tiergate`), AND the migrate step above AFFIRMATIVELY
      # established that it is not there yet. That second half is `pcmigrate`'s
      # own `bootstrap` output, which is set ONLY on its defer_bootstrap
      # branches -- the CCE-Secrets secret is absent, database_url was never
      # composed from Aurora, or CCE-Paperclip does not exist -- every one of
      # which means CCE-Database has never deployed. Reusing that signal rather
      # than adding a second `describe-db-clusters` probe also means there is
      # one answer to "is the substrate there", not two that can disagree; and
      # an unreadable probe still exits 1 in that step rather than reaching
      # here. A run that merely UPDATES an existing cluster prints nothing,
      # because it is not spending anything new.
      #
      # WHERE THE NUMBER COMES FROM. `scripts/cost-estimate.mjs --json` -- the
      # same estimator scripts/lib/cost-gate.ts parses for its primary money
      # line -- read for the line items it labels "(Paperclip...)", which is
      # exactly the delta this deploy adds. cost-gate.ts exports no bare figure
      # to import: its "~$110/mo" lives inside a prose string in the FALLBACK
      # branch of estimateLine(), reachable only when the estimator has already
      # failed. Summing the estimator's own line items is therefore the closest
      # thing to the single source, and it recalculates instead of becoming a
      # second hardcoded copy of the number.
      - name: Note the added Paperclip cost (job summary)
        # ONE condition, not two. `bootstrap` can only ever be '1' when the
        # step that writes it ran, and that step is itself gated on
        # `steps.tiergate.outputs.paperclip_enabled`, so re-stating the tier
        # gate here would be a second copy of an implication that already
        # holds. When pcmigrate is skipped the output is '', not '1'.
        if: steps.pcmigrate.outputs.bootstrap == '1'
        continue-on-error: true
        run: |
          set +e
          node scripts/cost-estimate.mjs --json > pc-cost.json || exit 0
          node -e '
          const j = JSON.parse(require("fs").readFileSync("pc-cost.json", "utf8"));
          const tier = Number(process.env.CCE_TIER);
          const row = j.results.find((r) => r.tier === tier);
          const lines = (row ? row.lines : []).filter((l) => l.label.includes("(Paperclip"));
          if (!lines.length) process.exit(0);
          const total = Math.round(lines.reduce((a, l) => a + l.usd, 0));
          const out = [
            "### Paperclip work engine: first provisioning",
            "",
            "This run creates the Paperclip substrate for the first time in this account.",
            "It adds roughly **$" + total + "/mo** of always-on cost at tier " + tier + " (" + row.label + "):",
            "",
            ...lines.map((l) => "- " + l.label + " - $" + l.usd + "/mo"),
            "",
            "Estimated by `scripts/cost-estimate.mjs` (unit prices as of " + j.asOf + "), the",
            "same estimator the local deploy gate prices from. The Aurora cluster and the EFS",
            "filesystem are RETAIN + deletionProtection, so lowering the tier later does NOT",
            "remove them. Notice only: nothing was blocked and nothing prompted.",
            "",
          ];
          for (const line of out) console.log(line);
          ' >> "$GITHUB_STEP_SUMMARY"
          rm -f pc-cost.json
          exit 0

      - name: CDK deploy
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          DOMAIN_NAME: ${{ steps.cfg.outputs.public_host }}
          # Both environments are infra-only: with a blank DOMAIN_NAME this
          # resolves privateAccessOnly, so the ALB stays INTERNAL. Matches what
          # prod already runs; blank here resolved to `chat` and would have
          # flipped it.
          CCE_DEPLOY_MODE: infra-only
          CDK_STACK_NAME: ${{ steps.cfg.outputs.stack_name }}
          DEPLOY_TIER: ${{ env.CCE_TIER }}
          CCE_TIER: ${{ env.CCE_TIER }}
          # Empty for prod, `staging` for staging. Cascades through
          # constants.ts so every named resource lives under
          # `claudeclaw[-suffix]-*`.
          CCE_NAME_SUFFIX: ${{ env.TARGET_ENV == 'staging' && 'staging' || '' }}
          # Pin the task definition to the image we just pushed (never `latest`).
          CCE_IMAGE_TAG: ${{ steps.tag.outputs.sha }}
          CCE_CICD_ENABLED: '1'
          # Paperclip ROUTER flag, and only that since Phase 9: the substrate
          # itself is provisioned by CCE_TIER above. This variable reaches the
          # orchestrator task definition (compute-stack.ts) where
          # paperclipRoutingEnabled() reads it, so `gh variable set
          # CCE_PAPERCLIP_ENABLED --body 1` plus a redeploy still flips
          # /api/missions over to the engine, and `--body 0` forces it back to
          # the legacy handlers without touching any infrastructure.
          CCE_PAPERCLIP_ENABLED: ${{ vars.CCE_PAPERCLIP_ENABLED }}
          # Pin both Paperclip task definitions to the image the build step
          # above just resolved. Absent until now, so synth fell back to an
          # unpullable placeholder TAG: a task definition that could never
          # start. Same shape as M22/M27, one layer down.
          CCE_PAPERCLIP_IMAGE_DIGEST: ${{ steps.paperclipimg.outputs.digest }}
          # M33. The ONLY Paperclip flag that changes runtime behaviour, and it
          # is safe when absent. Unset (the default, and the value on every
          # fresh clone and unconfigured runner) means DesiredCount 1: an
          # existing service keeps running. An operator can set it to 1 to park
          # the service for a migration-bearing image upgrade or emergency.
          # It can scale Paperclip down; it can never delete it, because the
          # service is unconditional in the template either way. Never derived
          # from a probe: the rejected version of this gate defaulted an
          # unreadable probe to "omit the service", and on THIS workflow, where
          # the variable did not exist at all, that would have deleted a
          # running service on every armed deploy and gone green.
          # On a standard first install the migrate step arms it automatically
          # after affirmatively establishing that the stack is absent. The
          # completion step migrates and clears it in this same workflow run.
          CCE_PAPERCLIP_BOOTSTRAP: ${{ vars.CCE_PAPERCLIP_BOOTSTRAP == '1' && '1' || steps.pcmigrate.outputs.bootstrap }}
          # The environment-scoped provisioning override. Declared in the
          # deploy-job `env:` block (see the comment there for why), so it is
          # already in this step's environment; forwarded explicitly all the
          # same, because THIS is the step where it decides whether Aurora and
          # EFS exist, and every other variable that does is listed here.
          CCE_PAPERCLIP_PROVISION_ENV_OVERRIDE: ${{ env.CCE_PAPERCLIP_PROVISION_ENV_OVERRIDE }}
          # The OTHER direction (Rank 3). At a tier that provisions no
          # Paperclip, infra/bin/app.ts REFUSES to synth unless the emptying is
          # declared — because these stacks are now always in the assembly, so
          # a Tier 0 `cdk deploy --all` UPDATES a provisioned substrate to an
          # empty template and orphans a retained, deletion-protected Aurora
          # and EFS.
          #
          # DELIBERATELY UNSET ON EVERY PATH, including staging, which used to
          # declare it. Staging now PROVISIONS via the override above, so it has
          # no empty substrate to declare — and a standing TEARDOWN=1 there would
          # pre-authorize emptying the very Aurora cluster the override is about
          # to create, the moment anyone removed the override. A production
          # dispatch that picks tier 0 must still stop, and now so must a staging
          # deploy that has lost its override.
          CCE_PAPERCLIP_TEARDOWN: ''
          CCE_ANOMALY_MONITOR_ARN: ${{ vars.CCE_ANOMALY_MONITOR_ARN }}
          # Must be forwarded or a CI deploy silently UNDOES the public
          # dashboard: synth resolves the feature off, drops the cloudflared
          # container so app.pgnos.ai stops serving, and removes the tunnel
          # secret from the template. That secret is RETAIN with a fixed name,
          # so it survives as an orphan and the next flagged deploy fails with
          # "already exists". The smoke test would not catch it: it curls the
          # ALB host, not the published hostname.
          CCE_PUBLIC_ACCESS: ${{ vars.CCE_PUBLIC_ACCESS }}
          CCE_PUBLIC_HOSTNAME: ${{ vars.CCE_PUBLIC_HOSTNAME }}
          CCE_PUBLIC_CONNECTOR_READY: ${{ steps.pubready.outputs.ready }}
          # Link base for magic-link emails; must match the published hostname.
          CCE_DASHBOARD_URL: ${{ vars.CCE_DASHBOARD_URL }}
          # Must be forwarded for the same reason as CCE_PUBLIC_ACCESS above:
          # compute-stack.ts reads `process.env.X ?? ''`, and invite-email.ts
          # treats a blank sender as skippedReason:'unconfigured'. Omitting
          # these switches magic-link email OFF with every health check green.
          CCE_EMAIL_FROM: ${{ vars.CCE_EMAIL_FROM }}
          CCE_SES_CONFIG_SET: ${{ vars.CCE_SES_CONFIG_SET }}
          # Ops alert destination. Same failure shape as the two above: unset
          # means observability-stack creates every outage alarm and subscribes
          # nobody, which is precisely the state the account was in until
          # 2026-08-15 — 32 alarms, a topic with zero subscribers, and a
          # ten-hour production outage found by a human loading the page.
          CCE_OPS_ALERT_EMAIL: ${{ vars.CCE_OPS_ALERT_EMAIL }}
          # OIDC trust is fail-closed: synth errors unless the repo identity
          # and the exact deploy subjects are explicit. Derived from the repo
          # running the workflow, never a hardcoded default.
          CCE_GITHUB_OWNER: ${{ github.repository_owner }}
          CCE_GITHUB_REPO: ${{ github.event.repository.name }}
          # This org mints OIDC subjects carrying the numeric ids
          # (repo:owner@318461635/repo@1324639154:...). Opt-in, because a fork
          # whose org still mints the classic form needs the classic subjects.
          # Set it BEFORE the next PRODUCTION deploy: only the prod IAM stack
          # creates this role (iam-stack.ts gates on !isStagingDeploy), so a
          # prod deploy with the variable unset rewrites a hand-patched trust
          # policy back to the classic form and locks CI out. Staging deploys
          # never touch it.
          #   gh variable set CCE_GITHUB_IMMUTABLE_SUBJECT --body 1
          CCE_GITHUB_OWNER_ID: ${{ vars.CCE_GITHUB_IMMUTABLE_SUBJECT == '1' && github.repository_owner_id || '' }}
          CCE_GITHUB_REPO_ID: ${{ vars.CCE_GITHUB_IMMUTABLE_SUBJECT == '1' && github.repository_id || '' }}
          CCE_GITHUB_DEPLOY_REFS: refs/heads/production,refs/heads/staging
          CCE_GITHUB_DEPLOY_ENVIRONMENTS: production,staging
        run: |
          npx cdk deploy --all \
            --require-approval never \
            --outputs-file cdk-outputs.json

      # A first install reaches the main deploy without a migration task
      # definition, so that deploy intentionally parks Paperclip at zero. The
      # stack and Aurora now exist: compose the database URL, migrate with the
      # task definition just published, then redeploy only Paperclip with the
      # bootstrap flag cleared. A deliberate operator park still wins.
      - name: Complete fresh Paperclip bootstrap
        if: steps.pcmigrate.outputs.bootstrap == '1' && vars.CCE_PAPERCLIP_BOOTSTRAP != '1'
        env:
          APP_SLUG: ${{ env.TARGET_ENV == 'staging' && 'claudeclaw-staging' || 'claudeclaw' }}
          STACK: ${{ steps.cfg.outputs.stack_name }}-Paperclip
          CDK_DEFAULT_ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          DOMAIN_NAME: ${{ steps.cfg.outputs.public_host }}
          CCE_DEPLOY_MODE: infra-only
          CDK_STACK_NAME: ${{ steps.cfg.outputs.stack_name }}
          DEPLOY_TIER: ${{ env.CCE_TIER }}
          CCE_TIER: ${{ env.CCE_TIER }}
          CCE_NAME_SUFFIX: ${{ env.TARGET_ENV == 'staging' && 'staging' || '' }}
          CCE_IMAGE_TAG: ${{ steps.tag.outputs.sha }}
          CCE_CICD_ENABLED: '1'
          CCE_PAPERCLIP_ENABLED: ${{ vars.CCE_PAPERCLIP_ENABLED }}
          CCE_PAPERCLIP_IMAGE_DIGEST: ${{ steps.paperclipimg.outputs.digest }}
          CCE_PAPERCLIP_BOOTSTRAP: ''
          CCE_PAPERCLIP_TEARDOWN: ''
          CCE_ANOMALY_MONITOR_ARN: ${{ vars.CCE_ANOMALY_MONITOR_ARN }}
          CCE_PUBLIC_ACCESS: ${{ vars.CCE_PUBLIC_ACCESS }}
          CCE_PUBLIC_HOSTNAME: ${{ vars.CCE_PUBLIC_HOSTNAME }}
          CCE_PUBLIC_CONNECTOR_READY: ${{ steps.pubready.outputs.ready }}
          CCE_DASHBOARD_URL: ${{ vars.CCE_DASHBOARD_URL }}
          CCE_EMAIL_FROM: ${{ vars.CCE_EMAIL_FROM }}
          CCE_SES_CONFIG_SET: ${{ vars.CCE_SES_CONFIG_SET }}
          CCE_OPS_ALERT_EMAIL: ${{ vars.CCE_OPS_ALERT_EMAIL }}
          CCE_GITHUB_OWNER: ${{ github.repository_owner }}
          CCE_GITHUB_REPO: ${{ github.event.repository.name }}
          CCE_GITHUB_OWNER_ID: ${{ vars.CCE_GITHUB_IMMUTABLE_SUBJECT == '1' && github.repository_owner_id || '' }}
          CCE_GITHUB_REPO_ID: ${{ vars.CCE_GITHUB_IMMUTABLE_SUBJECT == '1' && github.repository_id || '' }}
          CCE_GITHUB_DEPLOY_REFS: refs/heads/production,refs/heads/staging
          CCE_GITHUB_DEPLOY_ENVIRONMENTS: production,staging
        run: |
          set -euo pipefail
          SECRET="/$APP_SLUG/paperclip"
          DB_SECRET="/$APP_SLUG/paperclip-db"
          umask 077

          current=$(aws secretsmanager get-secret-value --secret-id "$SECRET" \
            --region "$AWS_REGION" --query SecretString --output text)
          db=$(aws secretsmanager get-secret-value --secret-id "$DB_SECRET" \
            --region "$AWS_REGION" --query SecretString --output text)
          if [ "$(printf '%s' "$db" | jq -r '(.host // "") != "" and (.username // "") != "" and (.password // "") != ""')" != "true" ]; then
            echo "::error::$DB_SECRET has no host/username/password after the bootstrap deploy." >&2
            exit 1
          fi
          printf '%s' "$current" > current.json
          printf '%s' "$db" > db.json
          unset current db
          jq -s '.[0] + {database_url: ("postgres://" + (.[1].username | @uri) + ":"
                 + (.[1].password | @uri) + "@" + .[1].host + ":"
                 + ((.[1].port // 5432) | tostring) + "/" + (.[1].dbname // "paperclip")
                 + "?sslmode=require")}' \
             current.json db.json > next.json
          if [ "$(jq '(.better_auth_secret // "") != "REPLACE_ME" and ((.better_auth_secret // "") | length) >= 32' next.json)" != "true" ]; then
            echo "::error::$SECRET has no valid better_auth_secret after bootstrap composition." >&2
            exit 1
          fi
          aws secretsmanager put-secret-value --secret-id "$SECRET" \
            --secret-string "file://next.json" --region "$AWS_REGION" \
            --no-cli-pager > /dev/null
          rm -f current.json db.json next.json
          echo "Composed Paperclip database_url after the bootstrap deploy (value not shown)."

          out=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --region "$AWS_REGION" --query 'Stacks[0].Outputs' --output json)
          get() {
            printf '%s' "$out" | jq -r --arg k "$1" '(.[]? | select(.OutputKey==$k) | .OutputValue) // ""'
          }
          CLUSTER=$(get PaperclipClusterName)
          FAMILY=$(get PaperclipMigrateTaskDefFamily)
          SUBNETS=$(get PaperclipMigrateSubnets)
          SG=$(get PaperclipMigrateSecurityGroup)
          if [ -z "$CLUSTER" ] || [ -z "$FAMILY" ] || [ -z "$SUBNETS" ] || [ -z "$SG" ]; then
            echo "::error::$STACK did not publish complete migration outputs." >&2
            exit 1
          fi

          echo "Running $FAMILY on $CLUSTER"
          TASK=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$FAMILY" \
            --launch-type FARGATE \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --region "$AWS_REGION" \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$TASK" ] || [ "$TASK" = "None" ]; then
            echo "::error::Paperclip migration returned no task ARN." >&2
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK" --region "$AWS_REGION"
          EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
            --region "$AWS_REGION" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT" != "0" ]; then
            REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" \
              --region "$AWS_REGION" --query 'tasks[0].stoppedReason' --output text)
            echo "::error::Paperclip migration exited $EXIT ($REASON). Refusing to start the service." >&2
            echo "Logs: aws logs tail /$APP_SLUG/paperclip --log-stream-name-prefix migrate" >&2
            exit 1
          fi
          echo "Paperclip schema is migrated; starting the service."
          npx cdk deploy "$STACK" \
            --exclusively \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: Force ECS rollout
        env:
          CLUSTER: ${{ steps.cfg.outputs.cluster }}
          SERVICE: ${{ steps.cfg.outputs.service }}
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --no-cli-pager > /dev/null
          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --region "$AWS_REGION"

      - name: Characterize Paperclip org and goals contracts
        if: steps.tiergate.outputs.paperclip_enabled == '1' && env.TARGET_ENV == 'staging'
        env:
          APP_SLUG: claudeclaw-staging
          CLUSTER: ${{ steps.cfg.outputs.cluster }}
          SERVICE: ${{ steps.cfg.outputs.service }}
        run: |
          set -euo pipefail
          expected_markers=(org whoami goals-list org-svg goal-create goal-get goal-update goal-delete)
          max_attempts=12
          delay=10
          tmpdir=$(mktemp -d)
          trap 'rm -rf -- "$tmpdir"' EXIT

          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --region "$AWS_REGION" --query 'services[0]' --output json > "$tmpdir/service.json"
          if ! task_definition=$(jq -er '.taskDefinition | select(type == "string" and length > 0)' "$tmpdir/service.json"); then
            echo "::error::The live orchestrator service has no task definition." >&2
            exit 1
          fi
          if ! network=$(jq -ce \
            '.networkConfiguration.awsvpcConfiguration
             | select(type == "object")
             | {awsvpcConfiguration: .}' "$tmpdir/service.json"); then
            echo "::error::The live orchestrator service has no awsvpc configuration." >&2
            exit 1
          fi

          # Keep overrides command-only. Environment overrides are exposed by
          # DescribeTasks and would create a second, inspectable secret path.
          overrides='{"containerOverrides":[{"name":"orchestrator","command":["node","dist/ops/paperclip-phase-probe.js"]}]}'
          aws ecs run-task --cluster "$CLUSTER" --task-definition "$task_definition" \
            --launch-type FARGATE --count 1 --network-configuration "$network" \
            --overrides "$overrides" --region "$AWS_REGION" \
            --output json > "$tmpdir/run-task.json"
          if [ "$(jq '.failures | length' "$tmpdir/run-task.json")" -ne 0 ]; then
            echo "::error::ECS rejected the Paperclip probe task." >&2
            jq -r '.failures[] | "  " + (.reason // "unknown ECS failure")' \
              "$tmpdir/run-task.json" >&2
            exit 1
          fi
          if ! task=$(jq -er '.tasks[0].taskArn | select(type == "string" and length > 0)' "$tmpdir/run-task.json"); then
            echo "::error::ECS returned no Paperclip probe task ARN." >&2
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task" --region "$AWS_REGION"
          aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task" \
            --region "$AWS_REGION" --output json > "$tmpdir/stopped-task.json"
          exit_code=$(jq -r \
            '.tasks[0].containers[]? | select(.name == "orchestrator") | .exitCode // empty' \
            "$tmpdir/stopped-task.json")
          task_id="${task##*/}"
          stream="task/orchestrator/$task_id"
          events_file="$tmpdir/events.json"
          printf '%s' '{"events":[]}' > "$events_file"

          missing=("${expected_markers[@]}")
          failure_seen=0
          for attempt in $(seq 1 "$max_attempts"); do
            if ! aws logs filter-log-events \
              --log-group-name "/$APP_SLUG/orchestrator" \
              --log-stream-names "$stream" \
              --filter-pattern '"PAPERCLIP_PHASE_PROBE"' \
              --region "$AWS_REGION" --output json > "$events_file" 2> "$tmpdir/log-read.err"; then
              printf '%s' '{"events":[]}' > "$events_file"
            fi

            if jq -e --arg failure "PAPERCLIP_PHASE_PROBE_FAILED" \
              '.events[]?.message | select(startswith($failure))' \
              "$events_file" > /dev/null; then
              failure_seen=1
            fi
            missing=()
            for marker in "${expected_markers[@]}"; do
              if ! jq -e --arg marker "$marker" '
                .events[]?.message
                | select(startswith("PAPERCLIP_PHASE_PROBE "))
                | ltrimstr("PAPERCLIP_PHASE_PROBE ")
                | fromjson?
                | select(.name == $marker)
              ' "$events_file" > /dev/null; then
                missing+=("$marker")
              fi
            done
            if [ "$failure_seen" -eq 1 ] || [ "${#missing[@]}" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Paperclip probe logs incomplete (${#missing[@]} markers missing); ingestion retry $attempt/$max_attempts."
              sleep "$delay"
            fi
          done

          jq -r '.events[]?.message | select(startswith("PAPERCLIP_PHASE_PROBE "))' \
            "$events_file"
          if [ "$failure_seen" -eq 1 ]; then
            jq -r '.events[]?.message | select(startswith("PAPERCLIP_PHASE_PROBE_FAILED"))' \
              "$events_file" >&2
            echo "::error::Paperclip probe emitted its failure marker." >&2
            exit 1
          fi
          if [ "$exit_code" != "0" ]; then
            echo "::error::Paperclip probe task exited ${exit_code:-without an exit code}." >&2
            exit 1
          fi
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Paperclip probe logs never contained every expected marker: ${missing[*]}" >&2
            exit 1
          fi

      - name: Smoke test (health)
        env:
          # Once the connector is attached, the environment IS reachable by
          # hostname even though DOMAIN_NAME is blank — Cloudflare publishes it,
          # not the ALB.
          #
          # This used to key off `steps.pubready.outputs.ready`, which made the
          # check self-blinding: the single condition that caused the sidecar to
          # be dropped ALSO emptied PUBLIC_HOST, so the smoke test short-circuited
          # with "no public hostname for this environment" and the run went green
          # while app.pgnos.ai was dark. A test must not be disabled by the fault
          # it exists to catch.
          #
          # So the question is now "does this environment DECLARE a public
          # hostname", not "did we just attach a connector". The one exception is
          # a deliberate bootstrap deploy, where the hostname is not live yet by
          # definition — and that has to be stated with CCE_PUBLIC_BOOTSTRAP=1.
          PUBLIC_HOST: ${{ (vars.CCE_PUBLIC_ACCESS == '1' && vars.CCE_PUBLIC_BOOTSTRAP != '1') && vars.CCE_PUBLIC_HOSTNAME || steps.cfg.outputs.public_host }}
        run: |
          set -euo pipefail
          # infra-only environments (staging) have no public hostname to curl.
          # The ECS "wait services-stable" step above is the real gate: it only
          # returns once the task passes its container health check and the
          # target group reports healthy. Deeper checks go through the SSM
          # tunnel (npm run dashboard:tunnel).
          if [ -z "$PUBLIC_HOST" ]; then
            echo "No public hostname for this environment (infra-only)."
            echo "ECS service reached steady state; health verified via the"
            echo "container health check and target group."
            exit 0
          fi
          echo "GET /health (with retry — CloudFront origin-header propagation can take ~60-90s after a Compute stack update)"
          attempts=0
          max_attempts=8
          delay=15
          until curl -fsS --max-time 15 "https://$PUBLIC_HOST/health" -o /tmp/health.json; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "Smoke failed after ${attempts} attempts (${max_attempts} x ${delay}s)" >&2
              exit 1
            fi
            echo "  attempt ${attempts}/${max_attempts} failed, retrying in ${delay}s..."
            sleep "$delay"
          done
          cat /tmp/health.json
          echo
          echo "Full readiness check is in docs/runbooks/deploy-validation.md"
