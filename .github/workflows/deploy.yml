name: Deploy

# PRODUCTION deploys are intentionally manual-only — click "Run workflow" in
# the Actions tab, or use `gh workflow run deploy.yml`. This is the A5
# approval gate: GitHub Free org plan does not allow required-reviewer
# protection rules on private repos, so we substitute manual-dispatch.
#
# STAGING is continuous: a merge into `staging` deploys itself, so QA and
# development fixes reach https://staging.pgnos.ai without a manual step. That
# is safe to automate precisely because it is not production — the environment
# is Tier 0, the ECS circuit breaker rolls a bad task back on its own, and the
# source guard still refuses any staging deploy that is not from
# refs/heads/staging. Production remains dispatch-plus-typed-confirmation.
on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - staging
      tier:
        description: 'Deploy tier (0/1/2/3) — must match env. Ignored for staging, which is pinned to Tier 0.'
        required: false
        default: '3'
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: ''

# Only one deploy at a time per branch.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  # Actions repository variable, never a tracked literal:
  #   gh variable set AWS_ACCOUNT_ID --body "<your-aws-account-id>"
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  # A push can only reach this workflow from `staging` (see the `on:` filter),
  # so a push event is always a staging deploy. Dispatch keeps its old default.
  TARGET_ENV: ${{ github.event_name == 'push' && 'staging' || github.event.inputs.env || 'prod' }}
  # env-specific values are resolved per-step from TARGET_ENV.
  # Staging is pinned to Tier 0 and ignores the `tier` input: the dispatch
  # default is '3' (Enterprise, ~$306/mo), which a careless staging dispatch
  # would otherwise provision. Production still honours the input.
  CCE_TIER: ${{ (github.event_name == 'push' || github.event.inputs.env == 'staging') && '0' || github.event.inputs.tier || '3' }}

jobs:
  source-guard:
    name: Validate deployment source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate deployment source
        env:
          # TARGET_ENV is inherited from the workflow-level env block, which
          # already resolves push -> staging. It is deliberately NOT overridden
          # here: the previous `${{ github.event.inputs.env }}` override reached
          # the guard as an empty string on a push and failed closed.
          GITHUB_REF: ${{ github.ref }}
        run: node scripts/ci/deploy-source-guard.mjs

  verify:
    name: Typecheck + Unit Tests
    needs: source-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Build + CDK Deploy + Smoke
    needs: [source-guard, verify]
    # A push to `staging` is its own approval; production still requires the
    # typed confirmation.
    if: github.event_name == 'push' || inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    # MUST resolve the same way TARGET_ENV does: on a push the dispatch input
    # is empty, and keying off it would select the `production` environment and
    # hand a staging deploy production's variables.
    # The condition is spelled out from the `github` context rather than reusing
    # `env.TARGET_ENV`, because the `env` context is NOT available in
    # `jobs.<job_id>.environment` — referencing it there makes the whole
    # workflow file invalid, and GitHub reports that as a 0-second run failure
    # with no jobs rather than as a syntax error.
    environment: ${{ (github.event_name == 'push' || github.event.inputs.env == 'staging') && 'staging' || 'production' }}
    timeout-minutes: 60
    steps:
      - name: Resolve env-specific values
        id: cfg
        run: |
          if [ "$TARGET_ENV" = "staging" ]; then
            # Match CDK constants: APP_NAME_SUFFIX=staging produces
            # app slug `claudeclaw-staging`, so the orchestrator repo
            # is `claudeclaw-staging-orchestrator` (suffix in the
            # middle, not at the end). IAM grant in iam-stack.ts
            # already matches this shape via `claudeclaw-*-orchestrator`.
            echo "ecr_repo=claudeclaw-staging-orchestrator" >> "$GITHUB_OUTPUT"
            echo "paperclip_ecr_repo=claudeclaw-staging-paperclip" >> "$GITHUB_OUTPUT"
            echo "stack_name=CCE-STAGING" >> "$GITHUB_OUTPUT"
            # Staging is infra-only. DOMAIN_NAME MUST stay empty: there is no
            # Route 53 hosted zone and no ACM certificate in this account, so a
            # non-empty value sends compute-stack.ts into HostedZone.fromLookup
            # and the deploy fails at synth. It would also flip the ALB
            # internet-facing. staging.pgnos.ai is published by a Cloudflare
            # Tunnel, never by the ALB.
            echo "public_host=" >> "$GITHUB_OUTPUT"
            echo "cluster=claudeclaw-staging-cluster" >> "$GITHUB_OUTPUT"
            echo "service=claudeclaw-staging-service" >> "$GITHUB_OUTPUT"
            # Suffix goes in the middle, matching buildPublicTunnelSecretName('staging').
            echo "tunnel_secret=claudeclaw-staging-public-tunnel" >> "$GITHUB_OUTPUT"
          else
            echo "ecr_repo=claudeclaw-orchestrator" >> "$GITHUB_OUTPUT"
            echo "paperclip_ecr_repo=claudeclaw-paperclip" >> "$GITHUB_OUTPUT"
            echo "stack_name=CCE" >> "$GITHUB_OUTPUT"
            # Empty for the same reason as staging: no Route 53 zone and no ACM
            # cert in this account. app.pgnos.ai is published by the Cloudflare
            # Tunnel and the live prod ALB is `internal`.
            echo "public_host=" >> "$GITHUB_OUTPUT"
            echo "cluster=claudeclaw-cluster" >> "$GITHUB_OUTPUT"
            echo "service=claudeclaw-service" >> "$GITHUB_OUTPUT"
            echo "tunnel_secret=claudeclaw-public-tunnel" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ClaudeClawGitHubDeploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy-${{ github.run_id }}

      - name: Login to ECR
        id: ecr
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          echo "registry=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repo exists
        env:
          ECR_REPO: ${{ steps.cfg.outputs.ecr_repo }}
          PAPERCLIP_ECR_REPO: ${{ steps.cfg.outputs.paperclip_ecr_repo }}
          CCE_PAPERCLIP_ENABLED: ${{ vars.CCE_PAPERCLIP_ENABLED }}
        run: |
          # scripts/deploy.ts does this for local deploys; the CI
          # workflow never did, so the first staging deploy hit a 403
          # trying to push to a non-existent repo. Idempotent.
          #
          # CI does NOT run scripts/deploy.ts, it runs `cdk deploy --all`
          # directly, so the deploy driver has TWO homes. A repo created in
          # only one of them is absent on the path that reaches staging.
          #
          # "Does not exist" and "I am not allowed to look" must not be the
          # same answer. `2>/dev/null` used to make them one: an AccessDenied
          # on describe fell through to create-repository, which then failed
          # with a second AccessDenied naming the wrong API. Same failure mode
          # as the connector-readiness probe below, whose comment records what
          # a swallowed AccessDenied cost on 2026-08-14.
          ensure_repo() {
            set +e
            out=$(aws ecr describe-repositories --repository-names "$1" --region "$AWS_REGION" --no-cli-pager 2>&1)
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "ECR repository already exists: $1"
              return 0
            fi
            case "$out" in
              *RepositoryNotFoundException*) ;;
              *)
                echo "::error::Cannot read ECR repository $1; refusing to guess that it is missing."
                echo "$out" >&2
                echo "The deploy role needs ecr:DescribeRepositories on $1." >&2
                echo "Grants live in infra/lib/iam-stack.ts (cicdRole, sid EcrPushAppImages /" >&2
                echo "EcrCreateAppRepos) and are applied by the CDK deploy LATER IN THIS JOB," >&2
                echo "so a new repo pattern must ship in an earlier deploy than the flag that" >&2
                echo "uses it. cicdRole is created only by the PROD IAM stack." >&2
                exit 1
                ;;
            esac
            echo "Creating ECR repository: $1"
            aws ecr create-repository --repository-name "$1" --image-scanning-configuration scanOnPush=true --image-tag-mutability MUTABLE --region "$AWS_REGION" --no-cli-pager
          }
          ensure_repo "$ECR_REPO"
          # Paperclip work engine (ADR 0010): same gate as the substrate
          # stacks, so an unarmed deploy still creates nothing.
          if [ "$CCE_PAPERCLIP_ENABLED" = "1" ]; then
            ensure_repo "$PAPERCLIP_ECR_REPO"
          fi

      - name: Compute image tag
        id: tag
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # Fargate task definition runs on linux/arm64 (Graviton). The
      # ubuntu-latest runner is amd64, so we use QEMU + buildx to
      # cross-compile. Without this, ECS tasks fail to start with
      # "exec format error" and the deployment circuit breaker trips.
      #
      # ORCHESTRATOR IMAGE ONLY. The Paperclip image below is deliberately NOT
      # built here: it goes through the same native ARM64 CodeBuild path the
      # local deploy driver uses, so that artifact has one build mechanism
      # rather than two. See the step's comment for why.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build + Push (linux/arm64)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ steps.tag.outputs.sha }}
          ECR_REPO: ${{ steps.cfg.outputs.ecr_repo }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg DEPLOY_TIER="$CCE_TIER" \
            -t "$REGISTRY/$ECR_REPO:$SHA" \
            -t "$REGISTRY/$ECR_REPO:latest" \
            --provenance=false \
            --push \
            -f Dockerfile \
            .

      # Mirrors the Paperclip image build in scripts/deploy.ts phase a (Phase
      # 1.5, ADR 0010) by running THE SAME CODE, not a hand-mirrored copy of
      # it. CI does NOT run scripts/deploy.ts - it runs `npx cdk deploy --all`
      # and hand-mirrors every step - and this is the one step where
      # hand-mirroring changed the ARTIFACT'S PROVENANCE rather than just its
      # wording. The previous version cross-built vendor/paperclip/Dockerfile
      # with QEMU-emulated `docker buildx` on this amd64 runner while the local
      # driver used the native ARM64 CodeBuild path in
      # scripts/lib/lifecycle/cloud-build.ts. Same Dockerfile, two mechanisms,
      # so the arm64 guarantee, the base-image pull and the whole build
      # environment differed between the path that gets exercised locally and
      # the path that actually reaches staging and production. Emulation was
      # also wrong on its own merits here: that Dockerfile runs apt-get and
      # then a full `tsc` over the entire Paperclip server (a 12,670-line route
      # module, a 212 KB generated OpenAPI, ~116 schema files) at 5-20x under
      # QEMU, with no layer cache on a fresh runner.
      #
      # scripts/ci/paperclip-image.ts is a thin CLI over that same module, not
      # a second implementation. It computes the SAME content-addressed tag
      # (contentImageTag: git's own tree hash for vendor/paperclip, so an app
      # commit that cannot alter this image does not rebuild it), performs the
      # SAME skip-if-already-present ECR probe with the same refusal to read an
      # AccessDenied as absence, and calls the SAME runCloudBuild with
      # `pushLatest: false` - no floating :latest in a repo whose only
      # legitimate consumer is a task definition pinned to the digest.
      #
      # The arm64 gate is unchanged and still the thing that stops a
      # wrong-platform image being pushed AT ALL: the buildspec's
      # `test "$ARCH" = "arm64"` runs INSIDE the build, on a native ARM host,
      # between `docker build` and `docker push`. It is not ceremony - the
      # pinned Paperclip base is a multi-arch INDEX, so a builder on the wrong
      # platform succeeds quietly and produces amd64 that crash-loops on
      # Fargate with "exec format error".
      #
      # Same gate as the ECR repo create above: with CCE_PAPERCLIP_ENABLED
      # unset this step never runs, so an unarmed deploy creates no CodeBuild
      # project, starts no build and pushes no image.
      #
      # IAM, and it is the same ordering trap the ECR grants carry: this step
      # needs cicdRole's PaperclipCloudBuild* statements (infra/lib/iam-stack.ts)
      # to stage the source zip, create/start the CodeBuild project and pass its
      # role. Those are applied by the CDK deploy LATER IN THIS JOB, so they
      # must land in a prior UNARMED deploy before CCE_PAPERCLIP_ENABLED is set,
      # and cicdRole is created only by the PROD IAM stack, so a staging arm
      # depends on a production IAM deploy having run first.
      #
      # timeout-minutes is belt and braces: runCloudBuild gives up at 35
      # minutes and the CodeBuild project times out at 30, so this only catches
      # a hung AWS CLI.
      - name: Build + Push Paperclip (native ARM64 CodeBuild)
        if: vars.CCE_PAPERCLIP_ENABLED == '1'
        timeout-minutes: 45
        env:
          PAPERCLIP_ECR_REPO: ${{ steps.cfg.outputs.paperclip_ecr_repo }}
          # Selects THIS environment's state bucket through the same
          # resolveStateNames() every other lifecycle tool uses. Must match the
          # CCE_NAME_SUFFIX the CDK deploy step below passes, or the source zip
          # is staged in the other environment's bucket.
          CCE_NAME_SUFFIX: ${{ env.TARGET_ENV == 'staging' && 'staging' || '' }}
          # Forwarded as the shared buildspec's --build-arg. The vendored
          # Dockerfile declares no matching ARG, so it is inert here - which is
          # also why it is correctly absent from the content tag.
          DEPLOY_TIER: ${{ env.CCE_TIER }}
        run: npx tsx scripts/ci/paperclip-image.ts

      # Mirrors the readiness gate in scripts/deploy.ts. The cloudflared
      # connector is an ESSENTIAL container that reads the `token` field of the
      # tunnel secret, so attaching it before a real token exists means ECS
      # cannot resolve the secret, the container never starts, and the rollout
      # fails. First deploy therefore creates the secret alone; the connector
      # joins on a later deploy, once `npm run public:setup` has written the
      # token. Only the EXISTENCE of the ready stage is checked — never the
      # value behind it.
      #
      # This block used to end "any failure here (including AccessDenied) leaves
      # the output empty, i.e. 'not ready', which is the safe direction." That
      # was only safe against ONE risk — attaching a connector to an empty token
      # — and catastrophic against the other, which is tearing the connector out
      # of an environment that is already serving traffic on it. Both directions
      # have to be safe, so an unreadable probe is now a hard failure.
      - name: Public connector readiness
        id: pubready
        if: vars.CCE_PUBLIC_ACCESS == '1'
        env:
          SECRET_ID: ${{ steps.cfg.outputs.tunnel_secret }}
        run: |
          set -uo pipefail
          # "Not ready" and "I could not find out" must not be the same answer.
          # On 2026-08-14 this step ran at 15:54:05Z, six minutes BEFORE the same
          # deploy granted the role secretsmanager:DescribeSecret at 16:00:04Z.
          # `2>/dev/null` swallowed the AccessDeniedException, the probe said
          # "not ready", CDK emitted a task definition with no cloudflared
          # sidecar, CloudFormation applied it to a healthy production service,
          # the run went green, and app.pgnos.ai served Cloudflare 1033 for nine
          # hours. Capture the error and stop instead of guessing.
          set +e
          stages=$(aws secretsmanager describe-secret \
                     --secret-id "$SECRET_ID" \
                     --region "$AWS_REGION" \
                     --query VersionIdsToStages \
                     --output text 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Could not read $SECRET_ID (exit $rc); refusing to guess readiness."
            echo "$stages" >&2
            echo "An unreadable probe is what removed the cloudflared sidecar from" >&2
            echo "production on 2026-08-14. Grant the deploy role" >&2
            echo "secretsmanager:DescribeSecret on $SECRET_ID and re-run." >&2
            exit 1
          fi
          if printf '%s' "$stages" | grep -q 'CCE-PUBLIC-READY'; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
            echo "Connector token present: attaching the cloudflared sidecar."
          else
            echo "ready=" >> "$GITHUB_OUTPUT"
            echo "No connector token yet for $SECRET_ID: deploying the secret only."
            echo "Run 'npm run public:setup -- --env=${TARGET_ENV}', then re-run this deploy."
            echo "That path drops the public entrypoint, so synth will also demand"
            echo "CCE_PUBLIC_BOOTSTRAP=1 (see assertPublicEntrypointRenderable)."
          fi

      - name: CDK deploy
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          DOMAIN_NAME: ${{ steps.cfg.outputs.public_host }}
          # Both environments are infra-only: with a blank DOMAIN_NAME this
          # resolves privateAccessOnly, so the ALB stays INTERNAL. Matches what
          # prod already runs; blank here resolved to `chat` and would have
          # flipped it.
          CCE_DEPLOY_MODE: infra-only
          CDK_STACK_NAME: ${{ steps.cfg.outputs.stack_name }}
          DEPLOY_TIER: ${{ env.CCE_TIER }}
          CCE_TIER: ${{ env.CCE_TIER }}
          # Empty for prod, `staging` for staging. Cascades through
          # constants.ts so every named resource lives under
          # `claudeclaw[-suffix]-*`.
          CCE_NAME_SUFFIX: ${{ env.TARGET_ENV == 'staging' && 'staging' || '' }}
          # Pin the task definition to the image we just pushed (never `latest`).
          CCE_IMAGE_TAG: ${{ steps.tag.outputs.sha }}
          CCE_CICD_ENABLED: '1'
          # Paperclip Aurora/EFS substrate, off unless the variable says 1.
          # Forwarded so arming it is `gh variable set CCE_PAPERCLIP_ENABLED
          # --body 1` plus a redeploy, not a code change and a ladder trip.
          CCE_PAPERCLIP_ENABLED: ${{ vars.CCE_PAPERCLIP_ENABLED }}
          CCE_ANOMALY_MONITOR_ARN: ${{ vars.CCE_ANOMALY_MONITOR_ARN }}
          # Must be forwarded or a CI deploy silently UNDOES the public
          # dashboard: synth resolves the feature off, drops the cloudflared
          # container so app.pgnos.ai stops serving, and removes the tunnel
          # secret from the template. That secret is RETAIN with a fixed name,
          # so it survives as an orphan and the next flagged deploy fails with
          # "already exists". The smoke test would not catch it: it curls the
          # ALB host, not the published hostname.
          CCE_PUBLIC_ACCESS: ${{ vars.CCE_PUBLIC_ACCESS }}
          CCE_PUBLIC_HOSTNAME: ${{ vars.CCE_PUBLIC_HOSTNAME }}
          CCE_PUBLIC_CONNECTOR_READY: ${{ steps.pubready.outputs.ready }}
          # Link base for magic-link emails; must match the published hostname.
          CCE_DASHBOARD_URL: ${{ vars.CCE_DASHBOARD_URL }}
          # Must be forwarded for the same reason as CCE_PUBLIC_ACCESS above:
          # compute-stack.ts reads `process.env.X ?? ''`, and invite-email.ts
          # treats a blank sender as skippedReason:'unconfigured'. Omitting
          # these switches magic-link email OFF with every health check green.
          CCE_EMAIL_FROM: ${{ vars.CCE_EMAIL_FROM }}
          CCE_SES_CONFIG_SET: ${{ vars.CCE_SES_CONFIG_SET }}
          # Ops alert destination. Same failure shape as the two above: unset
          # means observability-stack creates every outage alarm and subscribes
          # nobody, which is precisely the state the account was in until
          # 2026-08-15 — 32 alarms, a topic with zero subscribers, and a
          # ten-hour production outage found by a human loading the page.
          CCE_OPS_ALERT_EMAIL: ${{ vars.CCE_OPS_ALERT_EMAIL }}
          # OIDC trust is fail-closed: synth errors unless the repo identity
          # and the exact deploy subjects are explicit. Derived from the repo
          # running the workflow, never a hardcoded default.
          CCE_GITHUB_OWNER: ${{ github.repository_owner }}
          CCE_GITHUB_REPO: ${{ github.event.repository.name }}
          # This org mints OIDC subjects carrying the numeric ids
          # (repo:owner@318461635/repo@1324639154:...). Opt-in, because a fork
          # whose org still mints the classic form needs the classic subjects.
          # Set it BEFORE the next PRODUCTION deploy: only the prod IAM stack
          # creates this role (iam-stack.ts gates on !isStagingDeploy), so a
          # prod deploy with the variable unset rewrites a hand-patched trust
          # policy back to the classic form and locks CI out. Staging deploys
          # never touch it.
          #   gh variable set CCE_GITHUB_IMMUTABLE_SUBJECT --body 1
          CCE_GITHUB_OWNER_ID: ${{ vars.CCE_GITHUB_IMMUTABLE_SUBJECT == '1' && github.repository_owner_id || '' }}
          CCE_GITHUB_REPO_ID: ${{ vars.CCE_GITHUB_IMMUTABLE_SUBJECT == '1' && github.repository_id || '' }}
          CCE_GITHUB_DEPLOY_REFS: refs/heads/production,refs/heads/staging
          CCE_GITHUB_DEPLOY_ENVIRONMENTS: production,staging
        run: |
          npx cdk deploy --all \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: Force ECS rollout
        env:
          CLUSTER: ${{ steps.cfg.outputs.cluster }}
          SERVICE: ${{ steps.cfg.outputs.service }}
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --no-cli-pager > /dev/null
          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --region "$AWS_REGION"

      - name: Smoke test (health)
        env:
          # Once the connector is attached, the environment IS reachable by
          # hostname even though DOMAIN_NAME is blank — Cloudflare publishes it,
          # not the ALB.
          #
          # This used to key off `steps.pubready.outputs.ready`, which made the
          # check self-blinding: the single condition that caused the sidecar to
          # be dropped ALSO emptied PUBLIC_HOST, so the smoke test short-circuited
          # with "no public hostname for this environment" and the run went green
          # while app.pgnos.ai was dark. A test must not be disabled by the fault
          # it exists to catch.
          #
          # So the question is now "does this environment DECLARE a public
          # hostname", not "did we just attach a connector". The one exception is
          # a deliberate bootstrap deploy, where the hostname is not live yet by
          # definition — and that has to be stated with CCE_PUBLIC_BOOTSTRAP=1.
          PUBLIC_HOST: ${{ (vars.CCE_PUBLIC_ACCESS == '1' && vars.CCE_PUBLIC_BOOTSTRAP != '1') && vars.CCE_PUBLIC_HOSTNAME || steps.cfg.outputs.public_host }}
        run: |
          set -euo pipefail
          # infra-only environments (staging) have no public hostname to curl.
          # The ECS "wait services-stable" step above is the real gate: it only
          # returns once the task passes its container health check and the
          # target group reports healthy. Deeper checks go through the SSM
          # tunnel (npm run dashboard:tunnel).
          if [ -z "$PUBLIC_HOST" ]; then
            echo "No public hostname for this environment (infra-only)."
            echo "ECS service reached steady state; health verified via the"
            echo "container health check and target group."
            exit 0
          fi
          echo "GET /health (with retry — CloudFront origin-header propagation can take ~60-90s after a Compute stack update)"
          attempts=0
          max_attempts=8
          delay=15
          until curl -fsS --max-time 15 "https://$PUBLIC_HOST/health" -o /tmp/health.json; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "Smoke failed after ${attempts} attempts (${max_attempts} x ${delay}s)" >&2
              exit 1
            fi
            echo "  attempt ${attempts}/${max_attempts} failed, retrying in ${delay}s..."
            sleep "$delay"
          done
          cat /tmp/health.json
          echo
          echo "Full readiness check is in docs/runbooks/deploy-validation.md"
